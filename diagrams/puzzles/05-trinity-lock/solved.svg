<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280">
  <title>Trinity Lock -- Solved</title>
  <desc>The three ovals assembled in the Borromean configuration, with a verification inset showing that lifting one oval away lets the other two fall apart.</desc>

  <defs>
    <!-- Drop shadow filter for over-strands -->
    <filter id="overStrandShadowSolved05" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="var(--dia-ink, #24211a)" flood-opacity="0.25"/>
    </filter>
    <marker id="arrowGraySolved05" markerWidth="8" markerHeight="6" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0,0 L 8,3 L 0,6 Z" fill="var(--dia-rigid, #8a8275)"/>
    </marker>
  </defs>

  <!-- Green "Solved" indicator (upper-left) -->
  <circle cx="30" cy="26" r="15" fill="var(--dia-pos, #2f8f43)" opacity="0.12" stroke="var(--dia-pos, #2f8f43)" stroke-width="1.5"/>
  <path d="M22,26 L28,32 L40,20" fill="none" stroke="var(--dia-pos, #2f8f43)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ============================================================ -->
  <!-- MAIN: assembled Borromean configuration (same weave as the   -->
  <!-- target diagram: A over B, B over C, C over A — 6 crossings)  -->
  <!-- ============================================================ -->

  <!-- === LAYER 1: Full strokes at base === -->

  <!-- Oval C (Yellow) - full stroke, bottom layer -->
  <ellipse cx="175" cy="130" rx="110" ry="50"
           transform="rotate(-55,175,130)"
           fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5"/>

  <!-- Oval B (Blue) - full stroke -->
  <ellipse cx="175" cy="130" rx="110" ry="50"
           transform="rotate(55,175,130)"
           fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>

  <!-- Oval A (Red) - full stroke -->
  <ellipse cx="175" cy="130" rx="110" ry="50"
           transform="rotate(0,175,130)"
           fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>

  <!-- === LAYER 2: occlusion gaps along each over-strand's tangent, then the over-segments === -->

  <!-- Crossing 1: A over B (top-right area, true intersection at 247.3,92.3;
       12px gap centered there along A's local tangent, slope 0.396) -->
  <line x1="241.7" y1="90.1" x2="252.9" y2="94.5"
        stroke="var(--dia-surface, #fbf7ee)" stroke-width="10" stroke-linecap="round"/>
  <line x1="235.2" y1="87.5" x2="259.4" y2="97.1"
        stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5" stroke-linecap="round"
        filter="url(#overStrandShadowSolved05)"/>

  <!-- Crossing 2: A over B (bottom-left area, true intersection at 102.7,167.7;
       12px gap centered there along A's local tangent, slope 0.396) -->
  <line x1="97.1" y1="165.5" x2="108.3" y2="169.9"
        stroke="var(--dia-surface, #fbf7ee)" stroke-width="10" stroke-linecap="round"/>
  <line x1="90.6" y1="162.9" x2="114.8" y2="172.5"
        stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5" stroke-linecap="round"
        filter="url(#overStrandShadowSolved05)"/>

  <!-- Crossing 3: B over C (top-left area, ~x=110,y=89) -->
  <line x1="96" y1="92" x2="124" y2="86"
        stroke="var(--dia-surface, #fbf7ee)" stroke-width="10" stroke-linecap="round"/>
  <line x1="92" y1="93" x2="128" y2="85"
        stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round"
        filter="url(#overStrandShadowSolved05)"/>

  <!-- Crossing 4: B over C (bottom-right area, ~x=240,y=163) -->
  <line x1="226" y1="161" x2="254" y2="166"
        stroke="var(--dia-surface, #fbf7ee)" stroke-width="10" stroke-linecap="round"/>
  <line x1="222" y1="160" x2="258" y2="167"
        stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round"
        filter="url(#overStrandShadowSolved05)"/>

  <!-- Crossing 5: C over A (right area, ~x=278,y=130) -->
  <line x1="269" y1="127" x2="287" y2="133"
        stroke="var(--dia-surface, #fbf7ee)" stroke-width="10" stroke-linecap="round"/>
  <line x1="266" y1="126" x2="290" y2="134"
        stroke="var(--dia-gold, #c79a22)" stroke-width="2.5" stroke-linecap="round"
        filter="url(#overStrandShadowSolved05)"/>

  <!-- Crossing 6: C over A (left area, ~x=70,y=130) -->
  <line x1="61" y1="133" x2="79" y2="127"
        stroke="var(--dia-surface, #fbf7ee)" stroke-width="10" stroke-linecap="round"/>
  <line x1="58" y1="134" x2="82" y2="126"
        stroke="var(--dia-gold, #c79a22)" stroke-width="2.5" stroke-linecap="round"
        filter="url(#overStrandShadowSolved05)"/>

  <!-- === Labels for the main configuration === -->
  <text x="288" y="78" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-inksoft, #6a6151)">A (Red)</text>
  <text x="10" y="82" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-inksoft, #6a6151)">B (Blue)</text>
  <text x="155" y="236" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-inksoft, #6a6151)">C (Yellow)</text>

  <!-- Main title -->
  <text x="175" y="20" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="12" fill="var(--dia-ink, #24211a)" font-weight="bold">
    Trinity Lock -- Solved
  </text>

  <!-- Main caption -->
  <text x="175" y="252" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-rigid, #8a8275)">
    A over B, B over C, C over A &#x2014; locked
  </text>

  <!-- Separator between main figure and verification inset -->
  <line x1="335" y1="35" x2="335" y2="255"
        stroke="var(--dia-faint, #c9bda7)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============================================================ -->
  <!-- INSET: verification test — lift one oval away and the        -->
  <!-- remaining two fall apart (no pair is linked)                 -->
  <!-- ============================================================ -->

  <!-- Inset title -->
  <text x="472" y="28" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="11" fill="var(--dia-ink, #24211a)" font-weight="bold">
    Verification
  </text>

  <!-- Oval A (Red) lifted away, on its own -->
  <ellipse cx="472" cy="78" rx="52" ry="22"
           fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2"/>
  <text x="530" y="74" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-inksoft, #6a6151)">A removed</text>

  <!-- Arrow: A lifted up and away from the other two -->
  <line x1="472" y1="142" x2="472" y2="112"
        stroke="var(--dia-rigid, #8a8275)" stroke-width="1.5"
        marker-end="url(#arrowGraySolved05)"/>

  <!-- Oval B (Blue) falling away to the left -->
  <ellipse cx="425" cy="192" rx="50" ry="22"
           transform="rotate(55,425,192)"
           fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2"/>

  <!-- Oval C (Yellow) falling away to the right -->
  <ellipse cx="520" cy="192" rx="50" ry="22"
           transform="rotate(-55,520,192)"
           fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="2"/>

  <!-- Arrows: B and C separate with no resistance -->
  <line x1="396" y1="222" x2="374" y2="234"
        stroke="var(--dia-rigid, #8a8275)" stroke-width="1.5"
        marker-end="url(#arrowGraySolved05)"/>
  <line x1="549" y1="222" x2="571" y2="234"
        stroke="var(--dia-rigid, #8a8275)" stroke-width="1.5"
        marker-end="url(#arrowGraySolved05)"/>

  <!-- Inset caption -->
  <text x="472" y="252" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-rigid, #8a8275)">
    remove any one &#x2014; the other two are unlinked
  </text>
</svg>
