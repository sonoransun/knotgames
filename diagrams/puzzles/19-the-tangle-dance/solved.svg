<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360">
  <title>Puzzle 19: The Tangle Dance — Solved (fraction 0)</title>
  <desc>The square frame with all four ball handles seated. The blue cord runs straight across the top from NW to NE, the red cord straight across the bottom from SW to SE. The two strands are parallel with no crossings: the 0 tangle, exactly the state the setup card started from.</desc>

  <!-- Frame plate: outer square with open interior (evenodd hole) -->
  <path d="M40,40 H300 V300 H40 Z M75,75 V265 H265 V75 Z"
        fill="var(--dia-wash, #ece3d0)" fill-rule="evenodd"
        stroke="var(--dia-rigid, #8a8275)" stroke-width="1.5"/>

  <!-- Corner names embossed on the plate border -->
  <text x="57" y="61" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">NW</text>
  <text x="282" y="61" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">NE</text>
  <text x="57" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">SW</text>
  <text x="282" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">SE</text>

  <!-- Embossed move glyphs -->
  <text x="170" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="var(--dia-inksoft, #6a6151)">R ↻</text>
  <text x="282" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="var(--dia-inksoft, #6a6151)">T</text>

  <!-- Cup sockets -->
  <circle cx="80" cy="80" r="11" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>
  <circle cx="260" cy="80" r="11" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>
  <circle cx="80" cy="260" r="11" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>
  <circle cx="260" cy="260" r="11" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>

  <!-- The 0 tangle: two parallel strands, no crossings -->
  <line x1="80" y1="80" x2="260" y2="80" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="260" x2="260" y2="260" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Ball handles seated (blue on top, red on the bottom) -->
  <circle cx="80" cy="80" r="7" fill="var(--dia-cord, #1f57c4)"/>
  <circle cx="260" cy="80" r="7" fill="var(--dia-cord, #1f57c4)"/>
  <circle cx="80" cy="260" r="7" fill="var(--dia-neg, #cf3a26)"/>
  <circle cx="260" cy="260" r="7" fill="var(--dia-neg, #cf3a26)"/>

  <!-- Labels -->
  <line x1="268" y1="82" x2="310" y2="82" stroke="var(--dia-rigid, #8a8275)" stroke-width="1"/>
  <text x="313" y="85" font-family="system-ui, sans-serif" font-size="9.5" fill="var(--dia-inksoft, #6a6151)">all four handles seated</text>

  <line x1="170" y1="83" x2="170" y2="160" stroke="var(--dia-rigid, #8a8275)" stroke-width="1"/>
  <text x="170" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="var(--dia-inksoft, #6a6151)">no crossings — the strands are visibly parallel</text>

  <!-- Captions -->
  <text x="170" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="var(--dia-ink, #24211a)">Solved: fraction 0 — the identity tangle</text>
  <text x="170" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="var(--dia-inksoft, #6a6151)">blue back on top: exactly where the setup card began</text>
  <text x="170" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="var(--dia-inksoft, #6a6151)">parallel but vertical? that is ∞, not 0 — one more quarter-turn</text>
</svg>