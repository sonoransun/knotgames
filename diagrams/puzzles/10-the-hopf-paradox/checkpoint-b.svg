<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 380">
  <title>The Hopf Paradox - Checkpoint B</title>
  <desc>Mid-extraction at the north pole: the ring is half-way out through the polar gap, threaded on the hoop junction with half of it outside the cage. A blue curved arrow circling the ring shows rotation about the hoop axis and a red straight arrow along the pole shows advance; the two coupled motions must be performed together as one corkscrew &#8212; neither alone clears the junction.</desc>

  <defs>
    <marker id="ckbRot" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="var(--dia-cord, #1f57c4)"/>
    </marker>
    <marker id="ckbAdv" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="var(--dia-neg, #cf3a26)"/>
    </marker>
  </defs>

  <text x="175" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="var(--dia-ink, #24211a)" font-weight="bold">The Hopf Paradox - Checkpoint B</text>

  <!-- Polar hoop: back (left) half faded, front (right) half full -->
  <path d="M175,105 A100,100 0 0,0 175,305" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2.5" opacity="0.4"/>
  <path d="M175,105 A100,100 0 0,1 175,305" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2.5"/>

  <!-- Equatorial hoop: back half faded, front half full -->
  <path d="M75,205 A100,30 0 0,0 275,205" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2.5" opacity="0.4"/>
  <path d="M75,205 A100,30 0 0,1 275,205" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2.5"/>

  <!-- Pole welds -->
  <circle cx="175" cy="105" r="5" fill="var(--dia-ink, #24211a)"/>
  <circle cx="175" cy="305" r="5" fill="var(--dia-ink, #24211a)"/>
  <text x="175" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">S (pole)</text>

  <!-- N pole (the hoop junction the ring is threading through) -->
  <text x="162" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">N</text>

  <!-- Cord from the ring's inner tip down through the SE window to the handle -->
  <path d="M 141,121 Q 124,170 172,205 Q 228,240 292,232" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-dasharray="5,3"/>
  <rect x="292" y="225" width="26" height="14" rx="4" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>
  <text x="305" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-rigid, #8a8275)">handle</text>

  <!-- Ring half-way through the polar junction: outer half outside the cage, inner half inside.
       Crossing idiom: continuous ring outline (under), surface-colored occlusion stroke along the
       front hoop's tangent, then the front hoop's over-segment redrawn on top. -->
  <ellipse cx="175" cy="105" rx="34" ry="13" fill="none" stroke="var(--dia-ring, #b97d12)" stroke-width="2.5" transform="rotate(-18,175,105)"/>
  <line x1="189.2" y1="105.9" x2="206.8" y2="110.1" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M183,105.32 A100,100 0 0 1 212,112.1" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2.5"/>
  <text x="194" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-ring, #b97d12)">ring</text>

  <!-- Inside / outside markers straddling the cage wire -->
  <text x="250" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-inksoft, #6a6151)" font-style="italic">outside</text>
  <text x="250" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-inksoft, #6a6151)" font-style="italic">inside</text>

  <!-- Coupled motion 1: rotation about the ring axis (blue, curved) -->
  <path d="M150,73 A40,40 0 1 1 141.4,80.3" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" marker-end="url(#ckbRot)"/>
  <text x="133" y="56" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-cord, #1f57c4)">rotate</text>

  <!-- Coupled motion 2: advance along the polar axis (red, straight) -->
  <path d="M175,182 L175,156" fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5" marker-end="url(#ckbAdv)"/>
  <text x="184" y="166" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-neg, #cf3a26)">advance</text>

  <!-- Checkpoint label -->
  <text x="175" y="344" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="var(--dia-ink, #24211a)" font-weight="bold">rotate AND advance together &#8212; the corkscrew</text>
  <text x="175" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-inksoft, #6a6151)">Neither motion alone works &#8212; each by itself jams on the wires.</text>
</svg>
