<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 300">
  <title>The Prisoner's Ring - Solved</title>
  <desc>The frame with the cord hanging as one simple open loop through the bottom window with no crossings, and the freed ring off to the side.</desc>

  <defs>
    <marker id="arrowGraySolved03" markerWidth="8" markerHeight="6" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0,0 L 8,3 L 0,6 Z" fill="var(--dia-rigid, #8a8275)"/>
    </marker>
  </defs>

  <!-- Green "Solved" indicator (upper-right) -->
  <circle cx="320" cy="24" r="14" fill="var(--dia-pos, #2f8f43)" opacity="0.12" stroke="var(--dia-pos, #2f8f43)" stroke-width="1.5"/>
  <path d="M313,24 L318,29 L328,18" fill="none" stroke="var(--dia-pos, #2f8f43)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Frame: outer rectangle -->
  <rect x="75" y="40" width="200" height="150" rx="3" ry="3"
        fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>

  <!-- Crossbar at midpoint -->
  <line x1="75" y1="115" x2="275" y2="115"
        stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>

  <!-- Crossbar annotation: nothing wraps it anymore -->
  <text x="175" y="82" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)">crossbar is clear</text>

  <!-- === Cord: one simple open loop through the bottom window, no crossings === -->

  <!-- Top bight inside the bottom window -->
  <path d="M 162,150 Q 175,137 188,150"
        stroke="var(--dia-cord, #1f57c4)" stroke-width="2" stroke-dasharray="5,3" fill="none"/>

  <!-- Back strand: passes BEHIND the frame's bottom rail -->
  <path d="M 162,150 L 162,253"
        stroke="var(--dia-cord, #1f57c4)" stroke-width="2" stroke-dasharray="5,3" fill="none"/>
  <!-- Occlusion: gap along the rail's tangent where it passes over the back strand -->
  <line x1="154" y1="190" x2="170" y2="190"
        stroke="var(--dia-surface, #fbf7ee)" stroke-width="10" stroke-linecap="round"/>
  <!-- Bottom rail segment redrawn on top -->
  <line x1="146" y1="190" x2="178" y2="190"
        stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>

  <!-- Occlusion: gap along the front strand's tangent where it passes over the rail -->
  <line x1="188" y1="186" x2="188" y2="194"
        stroke="var(--dia-surface, #fbf7ee)" stroke-width="10" stroke-linecap="round"/>
  <!-- Front strand: passes IN FRONT of the frame's bottom rail -->
  <path d="M 188,150 L 188,253"
        stroke="var(--dia-cord, #1f57c4)" stroke-width="2" stroke-dasharray="5,3" fill="none"/>

  <!-- Bottom of the hanging loop -->
  <path d="M 162,253 Q 175,268 188,253"
        stroke="var(--dia-cord, #1f57c4)" stroke-width="2" stroke-dasharray="5,3" fill="none"/>

  <!-- Loop annotation -->
  <line x1="192" y1="225" x2="222" y2="216" stroke="var(--dia-rigid, #8a8275)" stroke-width="1"/>
  <text x="225" y="214" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)">simple open loop</text>
  <text x="225" y="226" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)">no crossings</text>

  <!-- Arrow: ring slid off the freed cord -->
  <path d="M 200,260 C 232,266 254,262 278,254"
        stroke="var(--dia-rigid, #8a8275)" stroke-width="1.5" fill="none"
        marker-end="url(#arrowGraySolved03)"/>

  <!-- Ring, freed, off to the side -->
  <circle cx="302" cy="248" r="17" fill="none" stroke="var(--dia-ring, #b97d12)" stroke-width="2.5"/>
  <text x="302" y="280" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-ring, #b97d12)" font-weight="bold">free</text>

  <!-- Caption -->
  <text x="160" y="295" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-inksoft, #6a6151)">crossings cancelled: +1 &#x2212; 1 = 0 &#x2014; ring slides off</text>
</svg>
