<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340">
  <title>Invariant scoreboard: square knot versus granny knot</title>
  <desc>A five-row table comparing the square knot and granny knot. Crossing number 6 equals 6, genus 2 equals 2, both are tricolorable with 27 colorings, both have Alexander polynomial (t - 1 + 1/t) squared. Only the signature differs: 0 for the square knot, +4 for the granny knot.</desc>

  <text x="280" y="32" font-family="system-ui, sans-serif" font-size="14" fill="var(--dia-ink, #24211a)" text-anchor="middle" font-weight="bold">THE INVARIANT SCOREBOARD</text>
  <text x="280" y="50" font-family="system-ui, sans-serif" font-size="10.5" fill="var(--dia-inksoft, #6a6151)" text-anchor="middle">square knot (Loop A) vs granny knot (Loop B)</text>
  <rect x="18" y="240" width="524" height="44" rx="6" fill="var(--dia-wash, #ece3d0)"/>
  <text x="34" y="74" font-family="system-ui, sans-serif" font-size="10.5" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">invariant</text>
  <text x="258" y="74" font-family="system-ui, sans-serif" font-size="10.5" fill="var(--dia-inksoft, #6a6151)" text-anchor="middle" font-weight="bold">Loop A (square)</text>
  <text x="388" y="74" font-family="system-ui, sans-serif" font-size="10.5" fill="var(--dia-inksoft, #6a6151)" text-anchor="middle" font-weight="bold">Loop B (granny)</text>
  <text x="506" y="74" font-family="system-ui, sans-serif" font-size="10.5" fill="var(--dia-inksoft, #6a6151)" text-anchor="middle" font-weight="bold">verdict</text>
  <line x1="18" y1="82" x2="542" y2="82" stroke="var(--dia-rigid, #8a8275)" stroke-width="1.5"/>
  <text x="34" y="96" font-family="system-ui, sans-serif" font-size="11.5" fill="var(--dia-ink, #24211a)">crossing number</text>
  <text x="34" y="109" font-family="system-ui, sans-serif" font-size="8.5" fill="var(--dia-inksoft, #6a6151)">Puzzle 9</text>
  <text x="258" y="101" font-family="system-ui, sans-serif" font-size="11.5" fill="var(--dia-ink, #24211a)" text-anchor="middle">6</text>
  <text x="388" y="101" font-family="system-ui, sans-serif" font-size="11.5" fill="var(--dia-ink, #24211a)" text-anchor="middle">6</text>
  <text x="506" y="102" font-family="system-ui, sans-serif" font-size="12" fill="var(--dia-pos, #2f8f43)" text-anchor="middle" font-weight="bold">✓ same</text>
  <line x1="18" y1="117" x2="542" y2="117" stroke="var(--dia-faint, #c9bda7)" stroke-width="1"/>
  <text x="34" y="138" font-family="system-ui, sans-serif" font-size="11.5" fill="var(--dia-ink, #24211a)">genus</text>
  <text x="34" y="151" font-family="system-ui, sans-serif" font-size="8.5" fill="var(--dia-inksoft, #6a6151)">Puzzles 11, 16</text>
  <text x="258" y="143" font-family="system-ui, sans-serif" font-size="11.5" fill="var(--dia-ink, #24211a)" text-anchor="middle">1 + 1 = 2</text>
  <text x="388" y="143" font-family="system-ui, sans-serif" font-size="11.5" fill="var(--dia-ink, #24211a)" text-anchor="middle">1 + 1 = 2</text>
  <text x="506" y="144" font-family="system-ui, sans-serif" font-size="12" fill="var(--dia-pos, #2f8f43)" text-anchor="middle" font-weight="bold">✓ same</text>
  <line x1="18" y1="159" x2="542" y2="159" stroke="var(--dia-faint, #c9bda7)" stroke-width="1"/>
  <text x="34" y="180" font-family="system-ui, sans-serif" font-size="11.5" fill="var(--dia-ink, #24211a)">tricolorable</text>
  <text x="34" y="193" font-family="system-ui, sans-serif" font-size="8.5" fill="var(--dia-inksoft, #6a6151)">Puzzle 15</text>
  <text x="258" y="185" font-family="system-ui, sans-serif" font-size="11.5" fill="var(--dia-ink, #24211a)" text-anchor="middle">yes (27 colorings)</text>
  <text x="388" y="185" font-family="system-ui, sans-serif" font-size="11.5" fill="var(--dia-ink, #24211a)" text-anchor="middle">yes (27 colorings)</text>
  <text x="506" y="186" font-family="system-ui, sans-serif" font-size="12" fill="var(--dia-pos, #2f8f43)" text-anchor="middle" font-weight="bold">✓ same</text>
  <line x1="18" y1="201" x2="542" y2="201" stroke="var(--dia-faint, #c9bda7)" stroke-width="1"/>
  <text x="34" y="222" font-family="system-ui, sans-serif" font-size="11.5" fill="var(--dia-ink, #24211a)">Alexander polynomial</text>
  <text x="34" y="235" font-family="system-ui, sans-serif" font-size="8.5" fill="var(--dia-inksoft, #6a6151)">multiplies under #</text>
  <text x="258" y="227" font-family="system-ui, sans-serif" font-size="11.5" fill="var(--dia-ink, #24211a)" text-anchor="middle">(t − 1 + 1/t)²</text>
  <text x="388" y="227" font-family="system-ui, sans-serif" font-size="11.5" fill="var(--dia-ink, #24211a)" text-anchor="middle">(t − 1 + 1/t)²</text>
  <text x="506" y="228" font-family="system-ui, sans-serif" font-size="12" fill="var(--dia-pos, #2f8f43)" text-anchor="middle" font-weight="bold">✓ same</text>
  <line x1="18" y1="243" x2="542" y2="243" stroke="var(--dia-faint, #c9bda7)" stroke-width="1"/>
  <text x="34" y="264" font-family="system-ui, sans-serif" font-size="11.5" fill="var(--dia-ink, #24211a)">signature σ</text>
  <text x="34" y="277" font-family="system-ui, sans-serif" font-size="8.5" fill="var(--dia-inksoft, #6a6151)">adds under #</text>
  <text x="258" y="269" font-family="system-ui, sans-serif" font-size="11.5" fill="var(--dia-ink, #24211a)" text-anchor="middle">0</text>
  <text x="388" y="269" font-family="system-ui, sans-serif" font-size="11.5" fill="var(--dia-ink, #24211a)" text-anchor="middle">+4</text>
  <text x="506" y="270" font-family="system-ui, sans-serif" font-size="12" fill="var(--dia-neg, #cf3a26)" text-anchor="middle" font-weight="bold">✗ differ</text>
  <text x="280" y="302" font-family="system-ui, sans-serif" font-size="11" fill="var(--dia-inksoft, #6a6151)" text-anchor="middle" font-style="italic">four invariants agree - the fifth settles it</text>
</svg>
