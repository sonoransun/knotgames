<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350">
  <title>The Torus Winder - Solved</title>
  <desc>Top-down torus view with the cord wound as a right-handed (2,3) torus knot - the trefoil. The cord loops twice around the central axis while wrapping three times around the tube: at each wrap it dips through the hole, runs hidden along the underside (dashed), and re-emerges toward the outer rim. It crosses itself three times, and every crossing has the same right-handed (positive) sign, drawn with over/under crossing gaps. A small ring is trapped on the cord between two ball-stops.</desc>



  <!-- Title -->
  <text x="150" y="25" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">The Torus Winder — Solved</text>
  <text x="150" y="42" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-pos, #2f8f43)">(2,3) torus knot wound</text>

  <!-- Torus: outer ellipse -->
  <ellipse cx="150" cy="170" rx="110" ry="70" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>

  <!-- Torus: inner ellipse (hole) -->
  <ellipse cx="150" cy="170" rx="40" ry="25" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>

  <!-- Cord wound as the (2,3) torus knot: two loops around the axis while
       wrapping three times around the tube. At each tube wrap the cord dips
       through the hole, runs hidden along the underside (dashed), and
       re-emerges at the outer rim. Crossings use the canonical idiom:
       continuous under-strand, surface-colored occlusion stroke along the
       over strand's tangent, over-segment drawn on top. -->
  <path d="M 70.3,142 C 73,139.2 76.3,136.5 80,134.2 C 83.6,131.9 87.9,129.8 92.3,128.1 C 96.7,126.4 101.6,125 106.5,124 C 111.3,123 116.5,122.4 121.4,122.1 C 126.4,121.8 131.5,121.8 136.2,122.1 C 141,122.5 145.7,123.2 150,124 C 154.3,124.8 158.5,126 162.3,127.2 C 166.1,128.5 169.5,130 172.7,131.5 C 175.9,133 178.8,134.6 181.5,136.3 C 184.2,137.9 186.5,139.7 188.7,141.4 C 191,143.1 193,144.9 194.9,146.6 C 196.8,148.4 198.5,150.2 200.2,152"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <path d="M 200.2,152 C 201.9,153.8 203.5,155.7 205,157.6 C 206.6,159.5 208,161.4 209.4,163.5 C 210.7,165.6 212,167.7 213,170 C 214,172.3 214.9,174.6 215.5,177.1 C 216.1,179.6 216.4,182.2 216.3,184.8 C 216.3,187.5 215.9,190.3 215,193 C 214,195.7 212.7,198.6 210.8,201.2 C 208.9,203.9 206.6,206.6 203.7,209.1 C 200.8,211.5 197.3,213.9 193.5,216 C 189.7,218 185.3,219.9 180.7,221.4 C 176.1,222.8 171,224 165.9,224.8 C 160.8,225.6 155.3,226 150,226"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-dasharray="5,3"/>
  <path d="M 150,226 C 144.7,226 139.2,225.6 134.1,224.8 C 129,224 123.9,222.8 119.3,221.4 C 114.7,219.9 110.3,218 106.5,216 C 102.7,213.9 99.2,211.5 96.3,209.1 C 93.4,206.6 91.1,203.9 89.2,201.2 C 87.3,198.6 86,195.7 85,193 C 84.1,190.3 83.7,187.5 83.7,184.8 C 83.6,182.2 83.9,179.6 84.5,177.1 C 85.1,174.6 86,172.3 87,170 C 88,167.7 89.3,165.6 90.6,163.5 C 92,161.4 93.4,159.5 95,157.6 C 96.5,155.7 98.1,153.8 99.8,152"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <path d="M 99.8,152 C 101.5,150.2 103.2,148.4 105.1,146.6 C 107,144.9 109,143.1 111.3,141.4 C 113.5,139.7 115.8,137.9 118.5,136.3 C 121.2,134.6 124.1,133 127.3,131.5 C 130.5,130 133.9,128.5 137.7,127.2 C 141.5,126 145.7,124.8 150,124 C 154.3,123.2 159,122.5 163.8,122.1 C 168.5,121.8 173.6,121.8 178.6,122.1 C 183.5,122.4 188.7,123 193.5,124 C 198.4,125 203.3,126.4 207.7,128.1 C 212.1,129.8 216.4,131.9 220,134.2 C 223.7,136.5 227,139.2 229.7,142"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-dasharray="5,3"/>
  <path d="M 229.7,142 C 232.3,144.8 234.5,147.9 235.9,151 C 237.4,154 238.2,157.3 238.4,160.5 C 238.5,163.7 238,166.9 237,170 C 236,173.1 234.3,176.1 232.2,178.9 C 230.2,181.6 227.5,184.3 224.6,186.6 C 221.7,189 218.4,191.1 215,193 C 211.5,194.9 207.8,196.5 204.1,197.9 C 200.4,199.3 196.5,200.4 192.7,201.4 C 189,202.4 185.2,203.1 181.5,203.7 C 177.8,204.3 174.2,204.7 170.6,205.1 C 167.1,205.4 163.6,205.6 160.2,205.8 C 156.7,205.9 153.4,206 150,206"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <path d="M 150,206 C 146.6,206 143.3,205.9 139.8,205.8 C 136.4,205.6 132.9,205.4 129.4,205.1 C 125.8,204.7 122.2,204.3 118.5,203.7 C 114.8,203.1 111,202.4 107.3,201.4 C 103.5,200.4 99.6,199.3 95.9,197.9 C 92.2,196.5 88.5,194.9 85,193 C 81.6,191.1 78.3,189 75.4,186.6 C 72.5,184.3 69.8,181.6 67.8,178.9 C 65.7,176.1 64,173.1 63,170 C 62,166.9 61.5,163.7 61.6,160.5 C 61.8,157.3 62.6,154 64.1,151 C 65.5,147.9 67.7,144.8 70.3,142"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-dasharray="5,3"/>

  <!-- Crossing 1 (lower-right): occlusion gap + over-segment -->
  <line x1="221.1" y1="189.7" x2="208.8" y2="196.3" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M 227.1,184.5 C 226.5,185 224.7,186.6 223.4,187.6 C 222.1,188.6 220.7,189.5 219.3,190.4 C 217.9,191.3 216.4,192.2 215,193 C 213.5,193.8 211.9,194.6 210.4,195.3 C 208.8,196 207.2,196.7 205.6,197.3 C 204,198 201.6,198.8 200.7,199.1" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <!-- Crossing 2 (lower-left): occlusion gap + over-segment -->
  <line x1="87.2" y1="199.7" x2="82.9" y2="186.3" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M 93,205.9 C 92.4,205.2 90.4,203 89.4,201.5 C 88.3,200 87.4,198.5 86.7,197 C 85.9,195.5 85.3,193.9 84.9,192.4 C 84.4,190.9 84.1,189.4 83.9,187.9 C 83.7,186.4 83.6,184.9 83.7,183.4 C 83.7,182 84,179.9 84.1,179.2" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <!-- Crossing 3 (top): occlusion gap + over-segment -->
  <line x1="143.1" y1="122.6" x2="156.9" y2="125.4" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M 136.1,122.1 C 136.9,122.2 139.5,122.4 141.2,122.6 C 142.9,122.8 144.5,123 146.2,123.3 C 147.8,123.6 149.4,123.9 150.9,124.2 C 152.5,124.5 154,124.9 155.5,125.3 C 157,125.6 158.4,126 159.9,126.5 C 161.3,126.9 163.3,127.6 164,127.8" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>

  <!-- Ring trapped on the cord (upper-left, threaded on the outer strand) -->
  <circle cx="85.9" cy="130.9" r="8" fill="none" stroke="var(--dia-ring, #b97d12)" stroke-width="2.5"/>
  <line x1="62" y1="112" x2="78" y2="124" stroke="var(--dia-faint, #c9bda7)" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="60" y="110" text-anchor="end" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-ring, #b97d12)">ring</text>

  <!-- Ball-stops flanking the ring on the cord -->
  <circle cx="72.9" cy="139.5" r="4" fill="var(--dia-rigid, #8a8275)" stroke="var(--dia-rigid, #8a8275)" stroke-width="1"/>
  <circle cx="102.1" cy="125" r="4" fill="var(--dia-rigid, #8a8275)" stroke="var(--dia-rigid, #8a8275)" stroke-width="1"/>

  <!-- Labels for ball-stops -->
  <line x1="48" y1="130" x2="68" y2="137" stroke="var(--dia-faint, #c9bda7)" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="46" y="128" text-anchor="end" font-family="system-ui, sans-serif" font-size="7" fill="var(--dia-inksoft, #6a6151)">stop</text>
  <line x1="114" y1="103" x2="104" y2="121" stroke="var(--dia-faint, #c9bda7)" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="112" y="100" font-family="system-ui, sans-serif" font-size="7" fill="var(--dia-inksoft, #6a6151)">stop</text>

  <!-- Winding label -->
  <text x="150" y="270" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)">2 loops around the axis, 3 wraps through the hole</text>
  <text x="150" y="285" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9" fill="var(--dia-rigid, #8a8275)">3 crossings, all right-handed (positive)</text>

  <!-- Legend -->
  <line x1="20" y1="310" x2="50" y2="310" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>
  <text x="58" y="314" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">torus surface</text>

  <line x1="20" y1="325" x2="50" y2="325" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <text x="58" y="329" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">cord (on top)</text>

  <line x1="170" y1="325" x2="200" y2="325" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="208" y="329" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">cord (underneath)</text>

  <circle cx="35" cy="340" r="4" fill="none" stroke="var(--dia-ring, #b97d12)" stroke-width="2"/>
  <text x="58" y="344" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">ring (trapped)</text>
</svg>