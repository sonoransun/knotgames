<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360">
  <title>Tricoloring the Trefoil</title>
  <desc>Two trefoil diagrams side by side: on the left a valid Fox tricoloring whose three arcs a1 (red), a2 (blue), a3 (yellow) bring all three colors together at every crossing, and on the right an invalid attempt using only two colors, where each crossing has two strands of one color and one of another.</desc>

  <!--
    Trefoil geometry: parametric curve x(t) = sin t + 2 sin 2t, y(t) = cos t - 2 cos 2t
    (y flipped for SVG), scale 26, panel centers (175,185) and (545,185).
    Under-passes at t = 1.8235, 3.9179, 6.0123 split the knot into its 3 Fox arcs:
      a1: under at top crossing, over at lower-left, under at lower-right (owns bottom petal)
      a2: under at lower-right, over at top, under at lower-left (owns upper-left petal)
      a3: under at lower-left, over at lower-right, under at top (owns upper-right petal)
    Crossings (each meets all three arcs):
      top (175,146) / (545,146)          over strand: a2
      lower-right (208.8,204.5) / +370   over strand: a3
      lower-left (141.2,204.5) / +370    over strand: a1
    Crossing idiom: continuous under arcs first, then a surface-colored occlusion
    stroke along the over strand's tangent, then the local over segment on top.
  -->

  <!-- Panel divider -->
  <line x1="360" y1="28" x2="360" y2="310" stroke="var(--dia-faint, #c9bda7)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ================================================== -->
  <!-- LEFT PANEL: valid tricoloring (3 colors)           -->
  <!-- ================================================== -->
  <text x="175" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="var(--dia-ink, #24211a)" font-weight="bold">Valid tricoloring &#x2014; 3 colors</text>

  <!-- Layer 1: the three arcs, each one continuous path in its own color -->
  <!-- a1 (red): top crossing -> over lower-left -> bottom petal -> lower-right crossing -->
  <path d="M 175,146 C 163.7,154.8 154,167.3 147.9,181 C 141.8,194.8 139.5,209.8 140.9,223.1 C 142.4,236.3 147.7,247.6 155.1,254.6 C 162.6,261.7 172.1,264.4 181.1,262.3 C 190,260.2 198.3,253.2 203.4,242.8 C 208.6,232.4 210.7,218.7 208.8,204.5"
        fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- a2 (blue): lower-right crossing -> over top -> upper-left petal -> lower-left crossing -->
  <path d="M 208.8,204.5 C 206.8,190.3 200.9,175.6 192,163.5 C 183.1,151.4 171.3,141.8 159.1,136.5 C 146.9,131.1 134.5,130.1 124.7,133 C 114.8,135.9 107.7,142.8 105,151.6 C 102.4,160.4 104.3,171 110.7,180.7 C 117.1,190.4 127.9,199.1 141.2,204.5"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- a3 (yellow): lower-left crossing -> over lower-right -> upper-right petal -> top crossing -->
  <path d="M 141.2,204.5 C 154.5,209.9 170.2,212.1 185.1,210.4 C 200.1,208.8 214.3,203.4 225,195.5 C 235.7,187.6 242.8,177.4 245.2,167.4 C 247.6,157.4 245.2,147.8 238.9,141.1 C 232.6,134.4 222.4,130.8 210.8,131.5 C 199.3,132.2 186.3,137.2 175,146"
        fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Layers 2+3: occlusion gap along the over strand's tangent, then over segment -->
  <!-- Top crossing: a2 (blue) over; under stubs are a3 (yellow) and a1 (red) -->
  <line x1="182.5" y1="151.8" x2="167.5" y2="140.2" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M 186.9,157.2 C 179.6,148.9 170.9,142.2 161.9,137.8"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lower-right crossing: a3 (yellow) over; under stubs are a1 (red) and a2 (blue) -->
  <line x1="200" y1="208.1" x2="217.6" y2="200.9" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M 193.1,209.2 C 204,207 214.2,202.8 222.5,197.2"
        fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lower-left crossing: a1 (red) over; under stubs are a2 (blue) and a3 (yellow) -->
  <line x1="142.5" y1="195.1" x2="139.9" y2="213.9" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M 145,188.6 C 141.4,199.1 140,210 140.7,220"
        fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Arc labels -->
  <text x="175" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-neg, #cf3a26)">a&#x2081; (red)</text>
  <text x="94" y="133" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-cord, #1f57c4)">a&#x2082; (blue)</text>
  <text x="256" y="133" text-anchor="start" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-gold, #c79a22)">a&#x2083; (yellow)</text>

  <!-- Crossing callouts: all three colors meet at every crossing -->
  <!-- Top crossing -->
  <line x1="175" y1="118" x2="175" y2="138" stroke="var(--dia-faint, #c9bda7)" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="175" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-inksoft, #6a6151)">3 colors meet <tspan fill="var(--dia-pos, #2f8f43)">&#x2713;</tspan></text>
  <!-- Lower-left crossing -->
  <line x1="108" y1="238" x2="134" y2="212" stroke="var(--dia-faint, #c9bda7)" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="88" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-inksoft, #6a6151)">3 colors meet <tspan fill="var(--dia-pos, #2f8f43)">&#x2713;</tspan></text>
  <!-- Lower-right crossing -->
  <line x1="242" y1="238" x2="216" y2="212" stroke="var(--dia-faint, #c9bda7)" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="262" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-inksoft, #6a6151)">3 colors meet <tspan fill="var(--dia-pos, #2f8f43)">&#x2713;</tspan></text>

  <!-- ================================================== -->
  <!-- RIGHT PANEL: invalid coloring (only 2 colors)      -->
  <!-- ================================================== -->
  <text x="545" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="var(--dia-ink, #24211a)" font-weight="bold">Invalid &#x2014; only 2 colors</text>

  <!-- Layer 1: same three arcs, but a2 and a3 are both blue -->
  <!-- a1 (red) -->
  <path d="M 545,146 C 533.7,154.8 524,167.3 517.9,181 C 511.8,194.8 509.5,209.8 510.9,223.1 C 512.4,236.3 517.7,247.6 525.1,254.6 C 532.6,261.7 542.1,264.4 551.1,262.3 C 560,260.2 568.3,253.2 573.4,242.8 C 578.6,232.4 580.7,218.7 578.8,204.5"
        fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- a2 (blue) -->
  <path d="M 578.8,204.5 C 576.8,190.3 570.9,175.6 562,163.5 C 553.1,151.4 541.3,141.8 529.1,136.5 C 516.9,131.1 504.5,130.1 494.7,133 C 484.8,135.9 477.7,142.8 475,151.6 C 472.4,160.4 474.3,171 480.7,180.7 C 487.1,190.4 497.9,199.1 511.2,204.5"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- a3 (blue as well: only two colors used) -->
  <path d="M 511.2,204.5 C 524.5,209.9 540.2,212.1 555.1,210.4 C 570.1,208.8 584.3,203.4 595,195.5 C 605.7,187.6 612.8,177.4 615.2,167.4 C 617.6,157.4 615.2,147.8 608.9,141.1 C 602.6,134.4 592.4,130.8 580.8,131.5 C 569.3,132.2 556.3,137.2 545,146"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Layers 2+3: occlusion gaps and over segments -->
  <!-- Top crossing: a2 (blue) over; under stubs a3 (blue) and a1 (red) -->
  <line x1="552.5" y1="151.8" x2="537.5" y2="140.2" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M 556.9,157.2 C 549.6,148.9 540.9,142.2 531.9,137.8"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lower-right crossing: a3 (blue) over; under stubs a1 (red) and a2 (blue) -->
  <line x1="570" y1="208.1" x2="587.6" y2="200.9" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M 563.1,209.2 C 574,207 584.2,202.8 592.5,197.2"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lower-left crossing: a1 (red) over; under stubs a2 (blue) and a3 (blue) -->
  <line x1="512.5" y1="195.1" x2="509.9" y2="213.9" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M 515,188.6 C 511.4,199.1 510,210 510.7,220"
        fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Arc labels -->
  <text x="545" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-neg, #cf3a26)">a&#x2081; (red)</text>
  <text x="464" y="133" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-cord, #1f57c4)">a&#x2082; (blue)</text>
  <text x="626" y="133" text-anchor="start" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-cord, #1f57c4)">a&#x2083; (blue)</text>

  <!-- Failed-rule callout at the top crossing -->
  <line x1="545" y1="118" x2="545" y2="138" stroke="var(--dia-faint, #c9bda7)" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="545" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-inksoft, #6a6151)"><tspan fill="var(--dia-neg, #cf3a26)">&#x2717;</tspan> rule fails: two same + one different</text>
  <!-- The other two crossings fail the same way -->
  <text x="491" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="var(--dia-neg, #cf3a26)">&#x2717;</text>
  <text x="599" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="var(--dia-neg, #cf3a26)">&#x2717;</text>

  <!-- Caption -->
  <text x="360" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="var(--dia-inksoft, #6a6151)">valid coloring: at every crossing, all same or all different &#x2014; and at least two colors used</text>
</svg>
