<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396">
  <title>Chirality: Mirror-Image Trefoils</title>
  <desc>Left-handed and right-handed trefoil knots on either side of a vertical dashed mirror line. Each knot carries a travel-direction arrow and a sign badge at each of its three crossings: all three crossings of the left trefoil are negative (writhe = minus 3) and all three of the right trefoil are positive (writhe = plus 3). An inset panel shows the right-hand crossing-sign convention: turning the over-strand arrow counterclockwise through the smaller angle onto the under-strand arrow marks the crossing plus 1.</desc>

  <!-- ==================================================================
       Both knots use the same path data, generated from the standard
       trefoil projection  x = sin t + 2 sin 2t,  y = cos t - 2 cos 2t
       (rotated 60 deg so one petal points up, scaled x22, y flipped for
       SVG). Depth z = sin 3t decides over/under at the 3 genuine
       self-intersections; crossing signs verified numerically via
       det[v_over, v_under] (as seen, y-up): all +1 for the group drawn
       as-is (right-handed, writhe +3). The left knot is the same group
       under scale(-1,1), which flips every crossing sign (writhe -3).

       Crossings follow the house occlusion idiom (see crossingGap() in
       lib/svg.js): continuous under strand (the full base path), then a
       surface-colored round-cap stroke along the over strand's tangent
       at the crossing, then a local over-segment retracing the curve on
       top. Local crossing coords: (28.6,-16.5) (-28.6,-16.5) (0,33).
       ================================================================== -->

  <!-- Figure title -->
  <text x="320" y="22" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">Chirality: mirror-image trefoils</text>

  <!-- Mirror line -->
  <text x="320" y="40" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9" fill="var(--dia-rigid, #8a8275)">mirror</text>
  <line x1="320" y1="46" x2="320" y2="284" stroke="var(--dia-rigid, #8a8275)"
        stroke-width="1" stroke-dasharray="4,3"/>

  <!-- =============== LEFT: left-handed trefoil (mirrored copy) =============== -->
  <g transform="translate(170,162) scale(-1,1)">
    <!-- Layer 1: full knot as one continuous strand (serves as every under strand) -->
    <path d="M 19.1,11
             C 25.5,-0.1 29,-12.8 29.2,-24.5
             C 29.4,-36.2 26.2,-46.9 20.8,-54.4
             C 15.3,-61.8 7.7,-66 0,-66
             C -7.7,-66 -15.3,-61.8 -20.8,-54.4
             C -26.2,-46.9 -29.4,-36.2 -29.2,-24.5
             C -29,-12.8 -25.5,-0.1 -19.1,11
             C -12.7,22.1 -3.4,31.5 6.6,37.5
             C 16.7,43.5 27.5,46.1 36.7,45.2
             C 45.9,44.2 53.3,39.7 57.2,33
             C 61,26.3 61.2,17.7 57.5,9.2
             C 53.7,0.8 46.1,-7.3 35.8,-13
             C 25.6,-18.7 12.8,-22 0,-22
             C -12.8,-22 -25.6,-18.7 -35.8,-13
             C -46.1,-7.3 -53.7,0.8 -57.5,9.2
             C -61.2,17.7 -61,26.3 -57.2,33
             C -53.3,39.7 -45.9,44.2 -36.7,45.2
             C -27.5,46.1 -16.7,43.5 -6.6,37.5
             C 3.4,31.5 12.7,22.1 19.1,11 Z"
          fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Layer 2: occlusion strokes along each over strand's tangent -->
    <line x1="27.4" y1="-7.6" x2="29.8" y2="-25.4"
          stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
    <line x1="-20.2" y1="-19.9" x2="-36.9" y2="-13.1"
          stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
    <line x1="-7.1" y1="27.5" x2="7.1" y2="38.5"
          stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>

    <!-- Layer 3: over segments retracing the curve across each crossing -->
    <path d="M 12.3,20.9
             C 16.6,15.5 20.3,9.4 23.1,3.1
             C 25.8,-3.3 27.7,-10 28.6,-16.5
             C 29.5,-23 29.4,-29.5 28.4,-35.4
             C 27.4,-41.3 25.5,-46.7 22.8,-51.2"
          fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 11.9,-21.1
             C 5.1,-22.1 -2,-22.3 -8.9,-21.5
             C -15.8,-20.7 -22.5,-19 -28.6,-16.5
             C -34.7,-14 -40.2,-10.7 -44.8,-6.9
             C -49.5,-3.1 -53.2,1.3 -55.7,5.8"
          fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -24.2,0.2
             C -21.7,6.7 -18.3,12.9 -14.2,18.4
             C -10.1,24 -5.2,29 0,33
             C 5.2,37 10.8,40.2 16.5,42.3
             C 22.1,44.4 27.7,45.4 32.9,45.4"
          fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Travel-direction arrowhead at the top petal tip -->
    <polygon points="-7,-66 5,-69.5 5,-62.5" fill="var(--dia-cord, #1f57c4)"/>
  </g>

  <!-- Left trefoil sign badges: all -1 (badges drawn unmirrored so text reads normally) -->
  <g font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">
    <circle cx="126" cy="136.5" r="8.5" fill="var(--dia-surface, #fbf7ee)"
            stroke="var(--dia-neg, #cf3a26)" stroke-width="1.5"/>
    <text x="126" y="139.7" fill="var(--dia-neg, #cf3a26)">&#x2212;1</text>
    <circle cx="214" cy="136.5" r="8.5" fill="var(--dia-surface, #fbf7ee)"
            stroke="var(--dia-neg, #cf3a26)" stroke-width="1.5"/>
    <text x="214" y="139.7" fill="var(--dia-neg, #cf3a26)">&#x2212;1</text>
    <circle cx="170" cy="213" r="8.5" fill="var(--dia-surface, #fbf7ee)"
            stroke="var(--dia-neg, #cf3a26)" stroke-width="1.5"/>
    <text x="170" y="216.2" fill="var(--dia-neg, #cf3a26)">&#x2212;1</text>
  </g>

  <text x="170" y="250" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="var(--dia-ink, #24211a)" font-weight="bold">Left-handed trefoil</text>
  <text x="170" y="268" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)">all crossings &#x2212;1 &#x2192; <tspan font-weight="bold" fill="var(--dia-neg, #cf3a26)">writhe = &#x2212;3</tspan></text>

  <!-- =============== RIGHT: right-handed trefoil (drawn as generated) =============== -->
  <g transform="translate(470,162)">
    <!-- Layer 1: full knot as one continuous strand (serves as every under strand) -->
    <path d="M 19.1,11
             C 25.5,-0.1 29,-12.8 29.2,-24.5
             C 29.4,-36.2 26.2,-46.9 20.8,-54.4
             C 15.3,-61.8 7.7,-66 0,-66
             C -7.7,-66 -15.3,-61.8 -20.8,-54.4
             C -26.2,-46.9 -29.4,-36.2 -29.2,-24.5
             C -29,-12.8 -25.5,-0.1 -19.1,11
             C -12.7,22.1 -3.4,31.5 6.6,37.5
             C 16.7,43.5 27.5,46.1 36.7,45.2
             C 45.9,44.2 53.3,39.7 57.2,33
             C 61,26.3 61.2,17.7 57.5,9.2
             C 53.7,0.8 46.1,-7.3 35.8,-13
             C 25.6,-18.7 12.8,-22 0,-22
             C -12.8,-22 -25.6,-18.7 -35.8,-13
             C -46.1,-7.3 -53.7,0.8 -57.5,9.2
             C -61.2,17.7 -61,26.3 -57.2,33
             C -53.3,39.7 -45.9,44.2 -36.7,45.2
             C -27.5,46.1 -16.7,43.5 -6.6,37.5
             C 3.4,31.5 12.7,22.1 19.1,11 Z"
          fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Layer 2: occlusion strokes along each over strand's tangent -->
    <line x1="27.4" y1="-7.6" x2="29.8" y2="-25.4"
          stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
    <line x1="-20.2" y1="-19.9" x2="-36.9" y2="-13.1"
          stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
    <line x1="-7.1" y1="27.5" x2="7.1" y2="38.5"
          stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>

    <!-- Layer 3: over segments retracing the curve across each crossing -->
    <path d="M 12.3,20.9
             C 16.6,15.5 20.3,9.4 23.1,3.1
             C 25.8,-3.3 27.7,-10 28.6,-16.5
             C 29.5,-23 29.4,-29.5 28.4,-35.4
             C 27.4,-41.3 25.5,-46.7 22.8,-51.2"
          fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 11.9,-21.1
             C 5.1,-22.1 -2,-22.3 -8.9,-21.5
             C -15.8,-20.7 -22.5,-19 -28.6,-16.5
             C -34.7,-14 -40.2,-10.7 -44.8,-6.9
             C -49.5,-3.1 -53.2,1.3 -55.7,5.8"
          fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -24.2,0.2
             C -21.7,6.7 -18.3,12.9 -14.2,18.4
             C -10.1,24 -5.2,29 0,33
             C 5.2,37 10.8,40.2 16.5,42.3
             C 22.1,44.4 27.7,45.4 32.9,45.4"
          fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Travel-direction arrowhead at the top petal tip -->
    <polygon points="-7,-66 5,-69.5 5,-62.5" fill="var(--dia-cord, #1f57c4)"/>
  </g>

  <!-- Right trefoil sign badges: all +1 -->
  <g font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">
    <circle cx="426" cy="136.5" r="8.5" fill="var(--dia-surface, #fbf7ee)"
            stroke="var(--dia-pos, #2f8f43)" stroke-width="1.5"/>
    <text x="426" y="139.7" fill="var(--dia-pos, #2f8f43)">+1</text>
    <circle cx="514" cy="136.5" r="8.5" fill="var(--dia-surface, #fbf7ee)"
            stroke="var(--dia-pos, #2f8f43)" stroke-width="1.5"/>
    <text x="514" y="139.7" fill="var(--dia-pos, #2f8f43)">+1</text>
    <circle cx="470" cy="213" r="8.5" fill="var(--dia-surface, #fbf7ee)"
            stroke="var(--dia-pos, #2f8f43)" stroke-width="1.5"/>
    <text x="470" y="216.2" fill="var(--dia-pos, #2f8f43)">+1</text>
  </g>

  <text x="470" y="250" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="var(--dia-ink, #24211a)" font-weight="bold">Right-handed trefoil</text>
  <text x="470" y="268" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)">all crossings +1 &#x2192; <tspan font-weight="bold" fill="var(--dia-pos, #2f8f43)">writhe = +3</tspan></text>

  <!-- =============== INSET: right-hand crossing-sign convention =============== -->
  <!-- Geometry matches the +1 panel of crossing-signs.svg: over strand runs
       upper-left to lower-right (cord), under strand runs left to right
       (rigid). Turning the over arrow CCW through the smaller angle onto the
       under arrow marks the crossing +1; a CW turn would mark it -1. -->
  <!-- Panel is outline-only: a tinted fill would show through the
       surface-colored occlusion stroke at the example crossing. -->
  <rect x="180" y="292" width="280" height="88" rx="6"
        fill="none" stroke="var(--dia-faint, #c9bda7)" stroke-width="1"/>
  <text x="320" y="310" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-ink, #24211a)" font-weight="bold">Sign convention (right-hand rule)</text>

  <!-- Under strand (continuous) with arrowhead -->
  <line x1="206" y1="346" x2="268" y2="346" stroke="var(--dia-rigid, #8a8275)" stroke-width="2.5"/>
  <polygon points="276,346 266,341 266,351" fill="var(--dia-rigid, #8a8275)"/>
  <!-- Occlusion along the over strand's tangent -->
  <line x1="229" y1="335" x2="251" y2="357"
        stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <!-- Over strand on top, with arrowhead -->
  <line x1="218" y1="324" x2="262" y2="368" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <polygon points="268,374 264.9,365.7 259.7,370.9" fill="var(--dia-cord, #1f57c4)"/>

  <!-- CCW rotation arc from the over arrow onto the under arrow -->
  <path d="M 275.6,371.9 A 44,44 0 0 0 283.7,351.4"
        fill="none" stroke="var(--dia-pos, #2f8f43)" stroke-width="1.5"/>
  <polygon points="284.6,344.4 286.7,351.8 280.7,351" fill="var(--dia-pos, #2f8f43)"/>
  <text x="289" y="336" font-family="system-ui, sans-serif" font-size="9"
        fill="var(--dia-pos, #2f8f43)">CCW</text>

  <!-- The +1 badge for this example crossing -->
  <circle cx="204" cy="320" r="8.5" fill="var(--dia-surface, #fbf7ee)"
          stroke="var(--dia-pos, #2f8f43)" stroke-width="1.5"/>
  <text x="204" y="323.2" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9" font-weight="bold" fill="var(--dia-pos, #2f8f43)">+1</text>

  <!-- Rule text -->
  <g font-family="system-ui, sans-serif" font-size="9.5" fill="var(--dia-inksoft, #6a6151)">
    <text x="318" y="330">Rotate the over arrow</text>
    <text x="318" y="343">CCW (&lt;180&#176;) onto the</text>
    <text x="318" y="356">under arrow &#x2192; sign +1;</text>
    <text x="318" y="369">rotate CW &#x2192; sign &#x2212;1.</text>
  </g>
</svg>
