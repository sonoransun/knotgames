<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320">
  <title>Hopf Fibration: Base Points and Linked Fibers</title>
  <desc>Two panels. Left: the base sphere S2 with three marked points p (green), q (blue), and r (red). Right: their Hopf fibers seen in ordinary 3-space by stereographic projection — three circles, one per base point, with each pair of circles linked exactly once; the fiber of p appears as the large circle. Dashed arrows lead from each base point to its fiber.</desc>

  <defs>
    <marker id="hopfArrowPos" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="var(--dia-pos, #2f8f43)"/>
    </marker>
    <marker id="hopfArrowCord" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="var(--dia-cord, #1f57c4)"/>
    </marker>
    <marker id="hopfArrowNeg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="var(--dia-neg, #cf3a26)"/>
    </marker>
  </defs>

  <!-- ===== Panel headers ===== -->
  <text x="150" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="var(--dia-ink, #24211a)" font-weight="bold">base sphere S<tspan baseline-shift="super" font-size="8">2</tspan></text>
  <text x="445" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="var(--dia-ink, #24211a)" font-weight="bold">fibers in S<tspan baseline-shift="super" font-size="8">3</tspan> (stereographic view)</text>

  <!-- ===== LEFT PANEL: base sphere with three marked points ===== -->
  <circle cx="150" cy="140" r="62" fill="var(--dia-wash, #ece3d0)" fill-opacity="0.55" stroke="var(--dia-inksoft, #6a6151)" stroke-width="2"/>
  <!-- equator and meridian great circles for 3D reading -->
  <ellipse cx="150" cy="140" rx="62" ry="17" fill="none" stroke="var(--dia-inksoft, #6a6151)" stroke-width="1.2" stroke-dasharray="5,3" opacity="0.45"/>
  <ellipse cx="150" cy="140" rx="17" ry="62" fill="none" stroke="var(--dia-inksoft, #6a6151)" stroke-width="1.2" stroke-dasharray="5,3" opacity="0.45"/>

  <!-- marked points p, q, r -->
  <circle cx="128" cy="106" r="4.5" fill="var(--dia-pos, #2f8f43)" stroke="var(--dia-surface, #fbf7ee)" stroke-width="1.5"/>
  <circle cx="185.6" cy="153.9" r="4.5" fill="var(--dia-cord, #1f57c4)" stroke="var(--dia-surface, #fbf7ee)" stroke-width="1.5"/>
  <circle cx="162" cy="183" r="4.5" fill="var(--dia-neg, #cf3a26)" stroke="var(--dia-surface, #fbf7ee)" stroke-width="1.5"/>
  <text x="115" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-style="italic" font-weight="bold" fill="var(--dia-pos, #2f8f43)">p</text>
  <text x="179" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-style="italic" font-weight="bold" fill="var(--dia-cord, #1f57c4)">q</text>
  <text x="149" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-style="italic" font-weight="bold" fill="var(--dia-neg, #cf3a26)">r</text>

  <!-- ===== Arrows: each base point maps to one whole fiber circle ===== -->
  <path d="M 136 102 Q 250 70 362 100" fill="none" stroke="var(--dia-pos, #2f8f43)" stroke-width="1.3" stroke-dasharray="5,4" opacity="0.7" marker-end="url(#hopfArrowPos)"/>
  <path d="M 194 154 Q 268 142 344 154" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="1.3" stroke-dasharray="5,4" opacity="0.7" marker-end="url(#hopfArrowCord)"/>
  <path d="M 172 189 C 260 288, 430 296, 500 240" fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="1.3" stroke-dasharray="5,4" opacity="0.7" marker-end="url(#hopfArrowNeg)"/>

  <!-- ===== RIGHT PANEL: three fibers, pairwise linked exactly once =====
       Geometry (computed numerically):
         A (fiber of p): circle center (445,116) r 74
         B (fiber of q): ellipse center (403,200) rx 66 ry 28 rot +48
         C (fiber of r): ellipse center (487,200) rx 66 ry 28 rot -48
       Crossings and over/under pattern (ALTERNATING within each pair, so
       every pair has linking number 1 — a Hopf link; contrast with the
       cyclic Borromean pattern where no pair links):
         A-B: B over at (378.8,149.1), A over at (429.9,188.4)
         A-C: A over at (460.1,188.4), C over at (511.2,149.1)
         B-C: B over at (445,212.0),   C over at (445,250.6)
       Each crossing: continuous under strand (the base curve), then a
       surface-colored occlusion stroke along the OVER strand's tangent,
       then the over strand's local arc redrawn on top. -->

  <!-- Base curves (continuous under strands) -->
  <circle cx="445" cy="116" r="74" fill="none" stroke="var(--dia-pos, #2f8f43)" stroke-width="2.5"/>
  <ellipse cx="403" cy="200" rx="66" ry="28" transform="rotate(48,403,200)" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <ellipse cx="487" cy="200" rx="66" ry="28" transform="rotate(-48,487,200)" fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>

  <!-- Crossing 1: B over A at (378.8,149.1) -->
  <line x1="367.3" y1="145.6" x2="390.3" y2="152.6" stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
  <path d="M 364.4 148.1 A 66 28 48 0 1 396.9 157.9" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Crossing 2: C over A at (511.2,149.1) -->
  <line x1="499.7" y1="152.6" x2="522.7" y2="145.6" stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
  <path d="M 493.1 157.9 A 66 28 -48 0 1 525.6 148.1" fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Crossing 3: A over B at (429.9,188.4) -->
  <line x1="418.1" y1="186.0" x2="441.6" y2="190.9" stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
  <path d="M 446.9 190.0 A 74 74 0 0 1 413.6 183.0" fill="none" stroke="var(--dia-pos, #2f8f43)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Crossing 4: A over C at (460.1,188.4) (drawn after crossing 3; its
       A-arc repaints the rim stretch its occlusion nicks) -->
  <line x1="448.4" y1="190.9" x2="471.9" y2="186.0" stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
  <path d="M 476.4 183.0 A 74 74 0 0 1 443.1 190.0" fill="none" stroke="var(--dia-pos, #2f8f43)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Crossing 5: B over C at (445,212.0) -->
  <line x1="439.7" y1="201.2" x2="450.3" y2="222.8" stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
  <path d="M 435.6 196.2 A 66 28 48 0 1 450.5 226.7" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Crossing 6: C over B at (445,250.6) -->
  <line x1="434.5" y1="244.7" x2="455.5" y2="256.5" stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
  <path d="M 468.1 249.0 A 66 28 -48 0 1 438.4 232.3" fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Fiber labels -->
  <text x="445" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-pos, #2f8f43)">fiber of p</text>
  <text x="340" y="190" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-cord, #1f57c4)">fiber of q</text>
  <text x="550" y="190" text-anchor="start" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-neg, #cf3a26)">fiber of r</text>

  <!-- ===== Captions ===== -->
  <text x="320" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="var(--dia-ink, #24211a)">each point of S<tspan baseline-shift="super" font-size="8">2</tspan> = one whole circle in S<tspan baseline-shift="super" font-size="8">3</tspan></text>
  <text x="320" y="309" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-style="italic" fill="var(--dia-inksoft, #6a6151)">any two fibers link exactly once</text>
</svg>
