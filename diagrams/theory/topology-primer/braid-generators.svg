<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290">
  <title>Braid Group Generators</title>
  <desc>Three panels on three strands: the generator sigma_1 crossing strand 1 over strand 2, the generator sigma_2 crossing strand 2 over strand 3, and the braid relation sigma_1 sigma_2 sigma_1 = sigma_2 sigma_1 sigma_2 drawn as two braids with identical endpoints.</desc>

  <defs>
    <marker id="swapArrow" markerWidth="6" markerHeight="4" refX="3" refY="2"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0,0 L 6,2 L 0,4 Z" fill="var(--dia-inksoft, #6a6151)"/>
    </marker>
  </defs>

  <!-- Panel separators -->
  <line x1="150" y1="42" x2="150" y2="250" stroke="var(--dia-faint, #c9bda7)" stroke-width="1"/>
  <line x1="287" y1="42" x2="287" y2="250" stroke="var(--dia-faint, #c9bda7)" stroke-width="1"/>

  <!-- ===== PANEL 1: sigma_1 (strand 1 crosses OVER strand 2) ===== -->
  <text x="80" y="32" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">&#x03C3;&#x2081;</text>
  <text x="80" y="47" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9.5" fill="var(--dia-rigid, #8a8275)">strand 1 over strand 2</text>

  <!-- Position numbers at top -->
  <text x="45" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-rigid, #8a8275)">1</text>
  <text x="80" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-rigid, #8a8275)">2</text>
  <text x="115" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-rigid, #8a8275)">3</text>

  <!-- Strand 3 (gold): uninvolved, straight -->
  <line x1="115" y1="65" x2="115" y2="245" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5"/>
  <!-- Strand 2 (red): continuous UNDER strand -->
  <path d="M 80,65 V 130 L 45,180 V 245" fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>
  <!-- Occlusion stroke along the over-strand's tangent at the crossing -->
  <line x1="57.9" y1="148.4" x2="67.1" y2="161.6" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <!-- Strand 1 (blue): OVER strand, drawn last -->
  <path d="M 45,65 V 130 L 80,180 V 245" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>

  <!-- Swap arrow -->
  <path d="M 47,118 Q 62.5,106 78,118" fill="none" stroke="var(--dia-inksoft, #6a6151)" stroke-width="1" marker-end="url(#swapArrow)"/>

  <!-- Resulting positions at bottom (colored by strand) -->
  <text x="45" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-neg, #cf3a26)">2</text>
  <text x="80" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-cord, #1f57c4)">1</text>
  <text x="115" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-gold, #c79a22)">3</text>

  <!-- ===== PANEL 2: sigma_2 (strand 2 crosses OVER strand 3) ===== -->
  <text x="215" y="32" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">&#x03C3;&#x2082;</text>
  <text x="215" y="47" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9.5" fill="var(--dia-rigid, #8a8275)">strand 2 over strand 3</text>

  <!-- Position numbers at top -->
  <text x="180" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-rigid, #8a8275)">1</text>
  <text x="215" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-rigid, #8a8275)">2</text>
  <text x="250" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-rigid, #8a8275)">3</text>

  <!-- Strand 1 (blue): uninvolved, straight -->
  <line x1="180" y1="65" x2="180" y2="245" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <!-- Strand 3 (gold): continuous UNDER strand -->
  <path d="M 250,65 V 130 L 215,180 V 245" fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5"/>
  <!-- Occlusion stroke along the over-strand's tangent -->
  <line x1="227.9" y1="148.4" x2="237.1" y2="161.6" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <!-- Strand 2 (red): OVER strand, drawn last -->
  <path d="M 215,65 V 130 L 250,180 V 245" fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>

  <!-- Swap arrow -->
  <path d="M 217,118 Q 232.5,106 248,118" fill="none" stroke="var(--dia-inksoft, #6a6151)" stroke-width="1" marker-end="url(#swapArrow)"/>

  <!-- Resulting positions at bottom -->
  <text x="180" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-cord, #1f57c4)">1</text>
  <text x="215" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-gold, #c79a22)">3</text>
  <text x="250" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-neg, #cf3a26)">2</text>

  <!-- ===== PANEL 3: the braid relation ===== -->
  <text x="427" y="32" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">&#x03C3;&#x2081;&#x03C3;&#x2082;&#x03C3;&#x2081; = &#x03C3;&#x2082;&#x03C3;&#x2081;&#x03C3;&#x2082;</text>
  <text x="427" y="47" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9.5" fill="var(--dia-rigid, #8a8275)">the braid relation</text>

  <!-- Left braid: sigma_1 sigma_2 sigma_1 (strands at x = 320, 355, 390) -->
  <!-- Strand letters at top -->
  <text x="320" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-cord, #1f57c4)">B</text>
  <text x="355" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-neg, #cf3a26)">R</text>
  <text x="390" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-gold, #c79a22)">Y</text>

  <!-- Gold strand: under at crossings 2 and 3, drawn first -->
  <path d="M 390,65 V 130 L 355,170 V 180 L 320,220 V 245" fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5"/>
  <!-- Occlusion at crossing 3 (red over gold) -->
  <line x1="332.2" y1="194" x2="342.8" y2="206" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <!-- Red strand: under at crossing 1, over at crossing 3 -->
  <path d="M 355,65 V 80 L 320,120 V 180 L 355,220 V 245" fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>
  <!-- Occlusion at crossing 1 (blue over red) -->
  <line x1="332.2" y1="94" x2="342.8" y2="106" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <!-- Occlusion at crossing 2 (blue over gold) -->
  <line x1="367.2" y1="144" x2="377.8" y2="156" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <!-- Blue strand: over at crossings 1 and 2, drawn last -->
  <path d="M 320,65 V 80 L 355,120 V 130 L 390,170 V 245" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>

  <!-- Generator labels beside each crossing -->
  <text x="306" y="104" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="var(--dia-inksoft, #6a6151)">&#x03C3;&#x2081;</text>
  <text x="306" y="154" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="var(--dia-inksoft, #6a6151)">&#x03C3;&#x2082;</text>
  <text x="306" y="204" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="var(--dia-inksoft, #6a6151)">&#x03C3;&#x2081;</text>

  <!-- Equals sign between the two braids -->
  <line x1="419" y1="149" x2="436" y2="149" stroke="var(--dia-inksoft, #6a6151)" stroke-width="2.5"/>
  <line x1="419" y1="161" x2="436" y2="161" stroke="var(--dia-inksoft, #6a6151)" stroke-width="2.5"/>

  <!-- Right braid: sigma_2 sigma_1 sigma_2 (strands at x = 465, 500, 535) -->
  <!-- Strand letters at top -->
  <text x="465" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-cord, #1f57c4)">B</text>
  <text x="500" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-neg, #cf3a26)">R</text>
  <text x="535" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-gold, #c79a22)">Y</text>

  <!-- Gold strand: under at crossings 1 and 2, drawn first -->
  <path d="M 535,65 V 80 L 500,120 V 130 L 465,170 V 245" fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5"/>
  <!-- Occlusion at crossing 1 (red over gold) -->
  <line x1="512.2" y1="94" x2="522.8" y2="106" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <!-- Red strand: over at crossing 1, under at crossing 3 -->
  <path d="M 500,65 V 80 L 535,120 V 180 L 500,220 V 245" fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>
  <!-- Occlusion at crossing 3 (blue over red) -->
  <line x1="512.2" y1="194" x2="522.8" y2="206" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <!-- Occlusion at crossing 2 (blue over gold) -->
  <line x1="477.2" y1="144" x2="487.8" y2="156" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <!-- Blue strand: over at crossings 2 and 3, drawn last -->
  <path d="M 465,65 V 130 L 500,170 V 180 L 535,220 V 245" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>

  <!-- Generator labels beside each crossing -->
  <text x="549" y="104" text-anchor="start" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="var(--dia-inksoft, #6a6151)">&#x03C3;&#x2082;</text>
  <text x="549" y="154" text-anchor="start" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="var(--dia-inksoft, #6a6151)">&#x03C3;&#x2081;</text>
  <text x="549" y="204" text-anchor="start" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="var(--dia-inksoft, #6a6151)">&#x03C3;&#x2082;</text>

  <!-- Identical endpoints at the bottom of both braids -->
  <text x="320" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-gold, #c79a22)">Y</text>
  <text x="355" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-neg, #cf3a26)">R</text>
  <text x="390" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-cord, #1f57c4)">B</text>
  <text x="465" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-gold, #c79a22)">Y</text>
  <text x="500" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-neg, #cf3a26)">R</text>
  <text x="535" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-cord, #1f57c4)">B</text>

  <!-- Captions -->
  <text x="148" y="276" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9" fill="var(--dia-rigid, #8a8275)">braids read top to bottom</text>
  <text x="427" y="276" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)">the Yang-Baxter relation: same endpoints, same braid</text>
</svg>
