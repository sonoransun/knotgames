<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 495">
  <title>Connected sums: square knot versus granny knot</title>
  <desc>Two composite loops drawn as trefoil clumps joined at a two-strand neck, each with a dashed sum sphere circling the neck. The square knot pairs a left-handed factor (three negative crossings) with a right-handed factor (three positive crossings), signatures +2 and -2 summing to 0. The granny knot pairs two left-handed factors, three negative crossings each, signatures +2 and +2 summing to +4.</desc>

