<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350">
  <title>Braid Sequence</title>
  <desc>Three-panel diagram showing the sigma_1, sigma_2, sigma_1 braid sequence on three strands, with crossings labeled and arrows showing swap direction.</desc>

  <defs>
    <marker id="swapArrow" markerWidth="6" markerHeight="4" refX="3" refY="2"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0,0 L 6,2 L 0,4 Z" fill="var(--dia-inksoft, #6a6151)"/>
    </marker>
  </defs>



  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">Braid Sequence: &#x03C3;&#x2081; &#x03C3;&#x2082; &#x03C3;&#x2081;</text>

  <!-- Panel separators -->
  <line x1="140" y1="40" x2="140" y2="280" stroke="var(--dia-faint, #c9bda7)" stroke-width="1"/>
  <line x1="270" y1="40" x2="270" y2="280" stroke="var(--dia-faint, #c9bda7)" stroke-width="1"/>

  <!-- === Panel 1: sigma_1 === -->
  <text x="70" y="55" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">&#x03C3;&#x2081;</text>
  <text x="70" y="70" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-rigid, #8a8275)">swap strands 1,2</text>

  <!-- Strand 3 (red) goes straight -->
  <line x1="100" y1="85" x2="100" y2="260" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>
  <!-- Strand 2 (yellow) passes under: one continuous path -->
  <path d="M 70,85 L 70,130 L 40,200 L 40,260" fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5"/>
  <!-- Occlusion stroke along the over strand's tangent at the crossing (55,165) -->
  <line x1="52" y1="158" x2="58" y2="172" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8" stroke-linecap="round"/>
  <!-- Strand 1 (blue) crosses over strand 2 (yellow), drawn last -->
  <path d="M 40,85 L 40,130 L 70,200 L 70,260" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>

  <!-- Swap arrow -->
  <path d="M 42,110 Q 55,100 68,110" fill="none" stroke="var(--dia-inksoft, #6a6151)" stroke-width="1" marker-end="url(#swapArrow)"/>

  <!-- === Panel 2: sigma_2 === -->
  <text x="205" y="55" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">&#x03C3;&#x2082;</text>
  <text x="205" y="70" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-rigid, #8a8275)">swap strands 2,3</text>

  <!-- Strand 1 (yellow, now at pos 1) goes straight -->
  <line x1="175" y1="85" x2="175" y2="260" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5"/>
  <!-- Strand 3 (red) passes under: one continuous path -->
  <path d="M 235,85 L 235,130 L 205,200 L 205,260" fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>
  <!-- Occlusion stroke along the over strand's tangent at the crossing (220,165) -->
  <line x1="217" y1="158" x2="223" y2="172" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8" stroke-linecap="round"/>
  <!-- Strand 2 (blue, now at pos 2) crosses over strand 3 (red), drawn last -->
  <path d="M 205,85 L 205,130 L 235,200 L 235,260" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>

  <!-- Swap arrow -->
  <path d="M 207,110 Q 220,100 233,110" fill="none" stroke="var(--dia-inksoft, #6a6151)" stroke-width="1" marker-end="url(#swapArrow)"/>

  <!-- === Panel 3: sigma_1 again === -->
  <text x="335" y="55" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">&#x03C3;&#x2081;</text>
  <text x="335" y="70" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-rigid, #8a8275)">swap strands 1,2</text>

  <!-- Strand 3 (blue, now at pos 3) goes straight -->
  <line x1="365" y1="85" x2="365" y2="260" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <!-- Strand 2 (red, now at pos 2) passes under: one continuous path -->
  <path d="M 335,85 L 335,130 L 305,200 L 305,260" fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>
  <!-- Occlusion stroke along the over strand's tangent at the crossing (320,165) -->
  <line x1="317" y1="158" x2="323" y2="172" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8" stroke-linecap="round"/>
  <!-- Strand 1 (yellow, at pos 1) crosses over strand 2 (red), drawn last -->
  <path d="M 305,85 L 305,130 L 335,200 L 335,260" fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5"/>

  <!-- Swap arrow -->
  <path d="M 307,110 Q 320,100 333,110" fill="none" stroke="var(--dia-inksoft, #6a6151)" stroke-width="1" marker-end="url(#swapArrow)"/>

  <!-- Legend -->
  <line x1="20" y1="300" x2="50" y2="300" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <text x="58" y="304" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">strand 1 (blue)</text>

  <line x1="150" y1="300" x2="180" y2="300" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5"/>
  <text x="188" y="304" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">strand 2 (yellow)</text>

  <line x1="290" y1="300" x2="320" y2="300" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>
  <text x="328" y="304" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">strand 3 (red)</text>

  <text x="200" y="340" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9" fill="var(--dia-rigid, #8a8275)">over-strand shown continuous; under-strand has gap at crossing</text>
</svg>