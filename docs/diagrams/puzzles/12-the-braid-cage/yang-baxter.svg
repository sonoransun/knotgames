<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <title>Yang-Baxter Relation</title>
  <desc>Visual proof that sigma_1*sigma_2*sigma_1 equals sigma_2*sigma_1*sigma_2. Three colored strands on each side produce the same permutation.</desc>



  <!-- Title -->
  <text x="200" y="22" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">Yang-Baxter Relation</text>

  <!-- Equals sign in center -->
  <line x1="193" y1="120" x2="207" y2="120" stroke="var(--dia-inksoft, #6a6151)" stroke-width="2"/>
  <line x1="193" y1="128" x2="207" y2="128" stroke="var(--dia-inksoft, #6a6151)" stroke-width="2"/>

  <!-- === LEFT SIDE: sigma_1 sigma_2 sigma_1 === -->
  <text x="90" y="45" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">&#x03C3;&#x2081;&#x03C3;&#x2082;&#x03C3;&#x2081;</text>

  <!-- Entry points: x=50, 90, 130 at y=55; crossings at y bands 70-95 (sigma_1),
       95-125 (sigma_2), 125-155 (sigma_1); exits at y=170 -->

  <!-- Full continuous strands (each drawn as one path; under-strands get an
       occlusion stroke + over-segment redraw at each crossing below) -->
  <!-- Yellow strand 2: under blue at crossing 1, over red at crossing 3 -->
  <path d="M 90,55 L 90,70 L 50,95 L 50,125 L 90,155 L 90,170"
        fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5"/>
  <!-- Red strand 3: under at crossings 2 and 3 -->
  <path d="M 130,55 L 130,95 L 90,125 L 50,155 L 50,170"
        fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>
  <!-- Blue strand 1: over at crossings 1 and 2 -->
  <path d="M 50,55 L 50,70 L 90,95 L 130,125 L 130,155 L 130,170"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>

  <!-- Crossing 1 (sigma_1): blue over yellow at (70,82.5) -->
  <line x1="64" y1="78.75" x2="76" y2="86.25"
        stroke="var(--dia-surface, #fbf7ee)" stroke-width="8" stroke-linecap="round"/>
  <line x1="50" y1="70" x2="90" y2="95" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>

  <!-- Crossing 2 (sigma_2): blue over red at (110,110) -->
  <line x1="104" y1="105.5" x2="116" y2="114.5"
        stroke="var(--dia-surface, #fbf7ee)" stroke-width="8" stroke-linecap="round"/>
  <line x1="90" y1="95" x2="130" y2="125" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>

  <!-- Crossing 3 (sigma_1): yellow over red at (70,140) -->
  <line x1="64" y1="135.5" x2="76" y2="144.5"
        stroke="var(--dia-surface, #fbf7ee)" stroke-width="8" stroke-linecap="round"/>
  <line x1="50" y1="125" x2="90" y2="155" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5"/>

  <!-- Result labels -->
  <text x="50" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-neg, #cf3a26)">R</text>
  <text x="90" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-gold, #c79a22)">Y</text>
  <text x="130" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-cord, #1f57c4)">B</text>

  <!-- === RIGHT SIDE: sigma_2 sigma_1 sigma_2 === -->
  <text x="310" y="45" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">&#x03C3;&#x2082;&#x03C3;&#x2081;&#x03C3;&#x2082;</text>

  <!-- Entry points: x=270, 310, 350 at y=55; crossings at y bands 70-95 (sigma_2),
       95-125 (sigma_1), 125-155 (sigma_2); exits at y=170 -->

  <!-- Red strand 3: under at crossings 1 and 2 -->
  <path d="M 350,55 L 350,70 L 310,95 L 270,125 L 270,155 L 270,170"
        fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>
  <!-- Yellow strand 2: over red at crossing 1, under blue at crossing 3 -->
  <path d="M 310,55 L 310,70 L 350,95 L 350,125 L 310,155 L 310,170"
        fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5"/>
  <!-- Blue strand 1: over at crossings 2 and 3 -->
  <path d="M 270,55 L 270,95 L 310,125 L 350,155 L 350,170"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>

  <!-- Crossing 1 (sigma_2): yellow over red at (330,82.5) -->
  <line x1="324" y1="78.75" x2="336" y2="86.25"
        stroke="var(--dia-surface, #fbf7ee)" stroke-width="8" stroke-linecap="round"/>
  <line x1="310" y1="70" x2="350" y2="95" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5"/>

  <!-- Crossing 2 (sigma_1): blue over red at (290,110) -->
  <line x1="284" y1="105.5" x2="296" y2="114.5"
        stroke="var(--dia-surface, #fbf7ee)" stroke-width="8" stroke-linecap="round"/>
  <line x1="270" y1="95" x2="310" y2="125" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>

  <!-- Crossing 3 (sigma_2): blue over yellow at (330,140) -->
  <line x1="324" y1="135.5" x2="336" y2="144.5"
        stroke="var(--dia-surface, #fbf7ee)" stroke-width="8" stroke-linecap="round"/>
  <line x1="310" y1="125" x2="350" y2="155" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>

  <!-- Result labels -->
  <text x="270" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-neg, #cf3a26)">R</text>
  <text x="310" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-gold, #c79a22)">Y</text>
  <text x="350" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-cord, #1f57c4)">B</text>

  <!-- Same permutation note -->
  <text x="200" y="200" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)">Same final permutation: (B,Y,R) &#x2192; (R,Y,B)</text>

  <!-- Legend -->
  <line x1="30" y1="225" x2="55" y2="225" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <text x="63" y="229" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">blue strand</text>

  <line x1="140" y1="225" x2="165" y2="225" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5"/>
  <text x="173" y="229" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">yellow strand</text>

  <line x1="260" y1="225" x2="285" y2="225" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>
  <text x="293" y="229" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">red strand</text>

  <text x="200" y="245" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9" fill="var(--dia-rigid, #8a8275)">gap at crossing = strand passes underneath</text>
</svg>