<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300">
  <title>The Braid Cage — Checkpoint A</title>
  <desc>State after the first move, sigma 2: the yellow strand crosses over the red strand as the rings at posts 2 and 3 swap, giving ring order Blue, Red, Yellow with a single strand crossing.</desc>

  <defs>
    <marker id="swapArrowCkA" markerWidth="6" markerHeight="4" refX="3" refY="2"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0,0 L 6,2 L 0,4 Z" fill="var(--dia-inksoft, #6a6151)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="210" y="25" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">Checkpoint A &#x2014; after move 1 of 2: &#x03C3;&#x2082;</text>

  <!-- Post labels (top) -->
  <text x="140" y="52" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-rigid, #8a8275)">post 1</text>
  <text x="210" y="52" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-rigid, #8a8275)">post 2</text>
  <text x="280" y="52" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-rigid, #8a8275)">post 3</text>

  <!-- Ring order before the move (top) -->
  <text x="140" y="68" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" font-weight="bold" fill="var(--dia-cord, #1f57c4)">B</text>
  <text x="210" y="68" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" font-weight="bold" fill="var(--dia-gold, #c79a22)">Y</text>
  <text x="280" y="68" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" font-weight="bold" fill="var(--dia-neg, #cf3a26)">R</text>

  <!-- Blue strand (post 1): untouched by sigma_2, goes straight -->
  <line x1="140" y1="80" x2="140" y2="235" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>

  <!-- Red strand (post 3 to post 2) passes UNDER: one continuous path -->
  <path d="M 280,80 L 280,115 L 210,185 L 210,235"
        fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>

  <!-- Occlusion stroke along the over strand's tangent at the crossing (245,150) -->
  <line x1="240" y1="145" x2="250" y2="155"
        stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>

  <!-- Yellow strand (post 2 to post 3) crosses OVER red, drawn last -->
  <path d="M 210,80 L 210,115 L 280,185 L 280,235"
        fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5"/>

  <!-- Swap arrow -->
  <path d="M 212,100 Q 245,90 278,100" fill="none"
        stroke="var(--dia-inksoft, #6a6151)" stroke-width="1" marker-end="url(#swapArrowCkA)"/>

  <!-- Move label -->
  <text x="90" y="148" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">&#x03C3;&#x2082;</text>
  <text x="90" y="162" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-rigid, #8a8275)">swap posts 2,3</text>
  <text x="90" y="173" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-rigid, #8a8275)">Yellow over Red</text>

  <!-- Ring order after the move (bottom) -->
  <text x="140" y="255" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" font-weight="bold" fill="var(--dia-cord, #1f57c4)">B</text>
  <text x="210" y="255" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" font-weight="bold" fill="var(--dia-neg, #cf3a26)">R</text>
  <text x="280" y="255" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" font-weight="bold" fill="var(--dia-gold, #c79a22)">Y</text>

  <!-- Captions -->
  <text x="210" y="278" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)">Ring order after &#x03C3;&#x2082;: Blue &#xB7; Red &#xB7; Yellow</text>
  <text x="210" y="293" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9" fill="var(--dia-rigid, #8a8275)">one crossing so far (Yellow over Red) &#x2014; braid word: &#x03C3;&#x2082;</text>
</svg>
