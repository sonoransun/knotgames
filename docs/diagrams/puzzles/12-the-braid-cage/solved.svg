<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340">
  <title>The Braid Cage — Solved</title>
  <desc>Final state after the two-move solution sigma 2 then sigma 1: rings reach the target order Red, Blue, Yellow over the colored target dots; the ring paths record the two crossings of the braid word sigma 2 then sigma 1, and the two anchored cords end in a single clean crossing.</desc>

  <defs>
    <marker id="swapArrowSolved" markerWidth="6" markerHeight="4" refX="3" refY="2"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0,0 L 6,2 L 0,4 Z" fill="var(--dia-inksoft, #6a6151)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="230" y="25" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">Solved &#x2014; braid word &#x03C3;&#x2082; &#xB7; &#x03C3;&#x2081;</text>

  <!-- Post labels (top) -->
  <text x="160" y="52" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-rigid, #8a8275)">post 1</text>
  <text x="230" y="52" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-rigid, #8a8275)">post 2</text>
  <text x="300" y="52" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-rigid, #8a8275)">post 3</text>

  <!-- Initial ring order (top): Blue, Yellow, Red -->
  <text x="160" y="68" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" font-weight="bold" fill="var(--dia-cord, #1f57c4)">B</text>
  <text x="230" y="68" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" font-weight="bold" fill="var(--dia-gold, #c79a22)">Y</text>
  <text x="300" y="68" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" font-weight="bold" fill="var(--dia-neg, #cf3a26)">R</text>

  <!-- Red strand: post 3 to post 2 (under at sigma_2), then post 2 to post 1
       (under at sigma_1). One continuous under-strand path. -->
  <path d="M 300,80 L 300,100 L 230,150 L 230,175 L 160,225 L 160,250"
        fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>

  <!-- Occlusion stroke along yellow's tangent at the sigma_2 crossing (265,125) -->
  <line x1="259" y1="121" x2="271" y2="129"
        stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>

  <!-- Occlusion stroke along blue's tangent at the sigma_1 crossing (195,200) -->
  <line x1="189" y1="196" x2="201" y2="204"
        stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>

  <!-- Yellow strand: crosses OVER red at sigma_2, then stays on post 3 -->
  <path d="M 230,80 L 230,100 L 300,150 L 300,250"
        fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5"/>

  <!-- Blue strand: stays on post 1 through sigma_2, crosses OVER red at sigma_1 -->
  <path d="M 160,80 L 160,175 L 230,225 L 230,250"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>

  <!-- Swap arrows -->
  <path d="M 232,92 Q 265,82 298,92" fill="none"
        stroke="var(--dia-inksoft, #6a6151)" stroke-width="1" marker-end="url(#swapArrowSolved)"/>
  <path d="M 162,167 Q 195,157 228,167" fill="none"
        stroke="var(--dia-inksoft, #6a6151)" stroke-width="1" marker-end="url(#swapArrowSolved)"/>

  <!-- Move labels -->
  <text x="90" y="123" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">move 1: &#x03C3;&#x2082;</text>
  <text x="90" y="137" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-rigid, #8a8275)">swap posts 2,3</text>

  <text x="90" y="198" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">move 2: &#x03C3;&#x2081;</text>
  <text x="90" y="212" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-rigid, #8a8275)">swap posts 1,2</text>

  <!-- Final ring order (bottom): Red, Blue, Yellow -->
  <text x="160" y="267" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" font-weight="bold" fill="var(--dia-neg, #cf3a26)">R</text>
  <text x="230" y="267" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" font-weight="bold" fill="var(--dia-cord, #1f57c4)">B</text>
  <text x="300" y="267" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" font-weight="bold" fill="var(--dia-gold, #c79a22)">Y</text>

  <!-- Target dots on the base, matched by each ring's final position -->
  <circle cx="160" cy="280" r="4" fill="var(--dia-neg, #cf3a26)"/>
  <circle cx="230" cy="280" r="4" fill="var(--dia-cord, #1f57c4)"/>
  <circle cx="300" cy="280" r="4" fill="var(--dia-gold, #c79a22)"/>
  <text x="320" y="283" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-rigid, #8a8275)">target dots</text>

  <!-- Check annotation -->
  <text x="230" y="305" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-inksoft, #6a6151)"><tspan font-weight="bold" fill="var(--dia-pos, #2f8f43)">&#x2713;</tspan> target order &#x2014; cords carry the braid word &#x03C3;&#x2082;&#xB7;&#x03C3;&#x2081;</text>

  <!-- Note -->
  <text x="230" y="323" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9" fill="var(--dia-rigid, #8a8275)">two strand crossings &#x2014; the braid word &#x03C3;&#x2082;&#xB7;&#x03C3;&#x2081; &#x2014; and the cords end in one clean crossing, no tangle</text>
</svg>
