<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350">
  <title>The Torus Winder - Checkpoint B</title>
  <desc>Top-down torus after the second hole-pass: the cord is seated in notches 1 through 4, the first self-crossing is locked in at the lower right with the top strand passing over the underside strand, and the free end arrives at notch 5 with one tube-wrap remaining.</desc>

  <!-- Title -->
  <text x="150" y="25" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">The Torus Winder — Checkpoint B</text>
  <text x="150" y="42" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-rigid, #8a8275)">after the 2nd hole-pass — one tube-wrap remains</text>

  <!-- Progress counters -->
  <rect x="50" y="52" width="200" height="18" rx="4" fill="var(--dia-wash, #ece3d0)" stroke="var(--dia-faint, #c9bda7)" stroke-width="0.5"/>
  <text x="150" y="65" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-ink, #24211a)" font-weight="bold">hole passes: 2/2 · tube wraps: 2/3</text>

  <!-- Torus: outer and inner (hole) rims -->
  <ellipse cx="150" cy="168" rx="110" ry="70" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>
  <ellipse cx="150" cy="168" rx="40" ry="25" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>

  <!-- Cord, first two tube wraps of the (2,3) winding.
       Solid = on top of the tube, dashed = hidden on the underside.
       Notch 1 over the top, hole at notch 2, under to notch 3, over the top
       again, hole at notch 4, then under toward notch 5. -->
  <path d="M 260,168 C 258.9,170.9 257.6,180.4 253.7,185.7 C 249.7,191 243.2,196 236.4,199.7 C 229.5,203.4 220.7,206.1 212.5,207.7 C 204.4,209.2 195.3,209.5 187.5,209.1 C 179.7,208.8 172.2,207.2 165.9,205.6 C 159.7,204 154.5,201.6 150,199.6 C 145.5,197.6 142.3,195.5 139,193.8 C 135.6,192.1 131.5,190.3 130,189.7"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <path d="M 130,189.7 C 128.3,189.2 123.8,187.9 119.8,186.9 C 115.9,185.9 111.4,185.3 106.5,183.8 C 101.6,182.3 95.7,180.7 90.5,178.1 C 85.2,175.4 79.3,172.1 75,168 C 70.7,163.9 66.5,158.8 64.6,153.5 C 62.7,148.2 62,141.9 63.6,136.3 C 65.2,130.7 68.9,124.5 74.1,119.7 C 79.3,114.9 91.5,109.4 95,107.4"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-dasharray="5,3"/>
  <path d="M 95,107.4 C 99.5,106.5 113.1,102.5 122.2,102 C 131.4,101.6 141.6,102.6 150,104.6 C 158.4,106.6 166.6,110.1 172.9,113.8 C 179.1,117.5 184.1,122.4 187.5,126.9 C 190.9,131.3 192.6,136.3 193.6,140.5 C 194.6,144.7 193.9,148.8 193.5,152.2 C 193.1,155.6 191.8,158.5 191.2,161.1 C 190.6,163.7 190.2,166.8 190,168"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <path d="M 190,168 C 190.2,169.1 190.5,172.1 191.1,174.5 C 191.7,177 192.9,179.6 193.3,182.8 C 193.8,186 194.5,189.6 193.9,193.6 C 193.2,197.5 192.1,202.1 189.4,206.4 C 186.6,210.6 182.7,215.3 177.4,219.2 C 172.1,223 165.1,226.8 157.6,229.2 C 150.1,231.7 140.9,233.5 132.2,233.9 C 123.5,234.4 109.9,232.1 105.4,231.7"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-dasharray="5,3"/>

  <!-- Crossing 1 (lower right): underside strand passes beneath the first
       wrap. Occlusion gap along the over strand's tangent, then the over
       segment redrawn on top. -->
  <line x1="194.5" y1="209.6" x2="180.5" y2="208.7" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M 217.5,206.6 C 215.9,206.9 210.8,208 207.4,208.5 C 204,208.9 200.6,209.2 197.3,209.3 C 194,209.4 190.7,209.3 187.5,209.1 C 184.3,209 181.2,208.6 178.3,208.2 C 175.3,207.7 172.5,207.2 169.8,206.6 C 167.2,205.9 163.5,204.8 162.3,204.5"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>

  <!-- Anchored end: short tail tied off at notch 1, ball-stop outside the rim -->
  <path d="M 260,168 C 266,169.5 271.5,173 275.5,177.5" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <circle cx="277.5" cy="179.5" r="4" fill="var(--dia-rigid, #8a8275)" stroke="var(--dia-rigid, #8a8275)" stroke-width="1"/>
  <text x="277" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="var(--dia-inksoft, #6a6151)">start</text>

  <!-- Working end: emerges over the rim short of notch 5; ring still free -->
  <line x1="105.4" y1="231.7" x2="87.1" y2="257.9" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="87.1" cy="257.9" r="4" fill="var(--dia-rigid, #8a8275)" stroke="var(--dia-rigid, #8a8275)" stroke-width="1"/>
  <circle cx="95.7" cy="245.6" r="7" fill="none" stroke="var(--dia-ring, #b97d12)" stroke-width="2.5"/>

  <!-- Winding direction arrow (on the top strand) -->
  <polygon points="223,205.5 231.7,197.6 234.7,205" fill="var(--dia-cord, #1f57c4)"/>

  <!-- Guide notches: filled = cord seated, outline = still open -->
  <circle cx="260" cy="168" r="4" fill="var(--dia-gold, #c79a22)" stroke="var(--dia-gold, #c79a22)" stroke-width="1.5"/>
  <circle cx="130" cy="189.7" r="4" fill="var(--dia-gold, #c79a22)" stroke="var(--dia-gold, #c79a22)" stroke-width="1.5"/>
  <circle cx="95" cy="107.4" r="4" fill="var(--dia-gold, #c79a22)" stroke="var(--dia-gold, #c79a22)" stroke-width="1.5"/>
  <circle cx="190" cy="168" r="4" fill="var(--dia-gold, #c79a22)" stroke="var(--dia-gold, #c79a22)" stroke-width="1.5"/>
  <circle cx="95" cy="228.6" r="4" fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="1.5"/>
  <circle cx="130" cy="146.3" r="4" fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="1.5"/>

  <!-- Notch numbers -->
  <text x="266" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-gold, #c79a22)" font-weight="bold">1</text>
  <text x="137" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-gold, #c79a22)" font-weight="bold">2</text>
  <text x="90" y="97" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-gold, #c79a22)" font-weight="bold">3</text>
  <text x="179" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-gold, #c79a22)" font-weight="bold">4</text>
  <text x="83" y="231" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-gold, #c79a22)" font-weight="bold">5</text>
  <text x="137" y="157" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-gold, #c79a22)" font-weight="bold">6</text>

  <!-- Annotations -->
  <line x1="222" y1="248" x2="191" y2="213" stroke="var(--dia-faint, #c9bda7)" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="225" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-inksoft, #6a6151)">1st crossing</text>
  <text x="16" y="274" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-inksoft, #6a6151)">free end → notch 5</text>
  <text x="110" y="250" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-ring, #b97d12)">ring (free)</text>
  <text x="150" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">remaining: 5 → over the top → 6 → under to 1</text>

  <!-- Legend -->
  <line x1="20" y1="316" x2="46" y2="316" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <text x="52" y="319" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">cord on top</text>
  <circle cx="168" cy="316" r="4" fill="var(--dia-gold, #c79a22)" stroke="var(--dia-gold, #c79a22)" stroke-width="1.5"/>
  <text x="178" y="319" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">engaged notch</text>
  <line x1="20" y1="332" x2="46" y2="332" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="52" y="335" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">cord underneath</text>
  <circle cx="168" cy="332" r="4" fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="1.5"/>
  <text x="178" y="335" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">open notch</text>
</svg>
