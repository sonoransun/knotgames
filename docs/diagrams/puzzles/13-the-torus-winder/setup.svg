<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350">
  <title>The Torus Winder - Setup</title>
  <desc>Top-down view of torus (two concentric ellipses) with the six numbered guide notches at the (2,3) rim-transition points - n1, n3, n5 on the outer rim and n2, n4, n6 on the inner rim. Cord not yet wound. Small ring and ball-stops visible nearby.</desc>

  

  <!-- Title -->
  <text x="150" y="25" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">The Torus Winder — Setup</text>
  <text x="150" y="42" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-rigid, #8a8275)">top-down view, cord unwound</text>

  <!-- Torus: outer ellipse -->
  <ellipse cx="150" cy="160" rx="110" ry="70" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>

  <!-- Torus: inner ellipse (hole) -->
  <ellipse cx="150" cy="160" rx="40" ry="25" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>

  <!-- Guide notch markers at the six (2,3) rim-transition points:
       n1/n3/n5 on the outer rim (axis angles 0°, 240°, 120°),
       n2/n4/n6 on the inner rim (axis angles 120°, 0°, 240°) -->
  <circle cx="260" cy="160" r="4" fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="1.5"/>
  <circle cx="130" cy="181.7" r="4" fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="1.5"/>
  <circle cx="95" cy="99.4" r="4" fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="1.5"/>
  <circle cx="190" cy="160" r="4" fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="1.5"/>
  <circle cx="95" cy="220.6" r="4" fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="1.5"/>
  <circle cx="130" cy="138.3" r="4" fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="1.5"/>

  <!-- Guide notch labels -->
  <text x="272" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="var(--dia-gold, #c79a22)">n1</text>
  <text x="137" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="var(--dia-gold, #c79a22)">n2</text>
  <text x="89" y="89" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="var(--dia-gold, #c79a22)">n3</text>
  <text x="199" y="171" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="var(--dia-gold, #c79a22)">n4</text>
  <text x="82" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="var(--dia-gold, #c79a22)">n5</text>
  <text x="137" y="149" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="var(--dia-gold, #c79a22)">n6</text>

  <!-- Cord (not yet wound, lying flat beside the torus) -->
  <path d="M 140,260 Q 160,255 180,260 Q 200,265 220,260 Q 240,255 260,262"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="200" y="278" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9" fill="var(--dia-cord, #1f57c4)">cord (unwound)</text>

  <!-- Small ring -->
  <circle cx="80" cy="270" r="8" fill="none" stroke="var(--dia-ring, #b97d12)" stroke-width="2"/>
  <text x="80" y="288" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-ring, #b97d12)">ring</text>

  <!-- Ball-stops -->
  <circle cx="130" cy="275" r="4" fill="var(--dia-rigid, #8a8275)" stroke="var(--dia-rigid, #8a8275)" stroke-width="1"/>
  <circle cx="145" cy="275" r="4" fill="var(--dia-rigid, #8a8275)" stroke="var(--dia-rigid, #8a8275)" stroke-width="1"/>
  <text x="137" y="292" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-inksoft, #6a6151)">ball-stops</text>

  <!-- Dimension annotation: outer radius -->
  <line x1="150" y1="160" x2="260" y2="160" stroke="var(--dia-rigid, #8a8275)" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="205" y="155" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-rigid, #8a8275)">R = outer</text>

  <!-- Dimension annotation: inner radius -->
  <line x1="150" y1="160" x2="190" y2="160" stroke="var(--dia-rigid, #8a8275)" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="170" y="172" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-rigid, #8a8275)">r = inner</text>

  <!-- Legend -->
  <line x1="20" y1="310" x2="50" y2="310" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>
  <text x="58" y="314" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">torus surface</text>

  <line x1="20" y1="325" x2="50" y2="325" stroke="var(--dia-cord, #1f57c4)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="58" y="329" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">flexible cord</text>

  <circle cx="35" cy="340" r="4" fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="1.5"/>
  <text x="58" y="344" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">guide notch</text>
</svg>