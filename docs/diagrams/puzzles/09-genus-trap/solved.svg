<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <title>Genus Trap - Solved</title>
  <desc>The acrylic block with its two tunnel labels, and two rings shown separately below, free from the block. The cord remains threaded but its path has changed.</desc>

  

  <!-- Green "Solved" indicator (upper-right) -->
  <circle cx="375" cy="22" r="16" fill="var(--dia-pos, #2f8f43)" opacity="0.12" stroke="var(--dia-pos, #2f8f43)" stroke-width="1.5"/>
  <path d="M367,22 L373,28 L385,16" fill="none" stroke="var(--dia-pos, #2f8f43)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Acrylic block -->
  <rect x="100" y="20" width="200" height="100" rx="4" fill="var(--dia-wash, #ece3d0)" fill-opacity="0.08" stroke="var(--dia-ink, #24211a)" stroke-width="2"/>

  <!-- Tunnel A (horizontal, red) -->
  <line x1="100" y1="80" x2="300" y2="80" stroke="var(--dia-neg, #cf3a26)" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="100" cy="80" r="3" fill="var(--dia-neg, #cf3a26)"/>
  <circle cx="300" cy="80" r="3" fill="var(--dia-neg, #cf3a26)"/>
  <text x="115" y="95" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-neg, #cf3a26)" font-weight="bold">[A]</text>

  <!-- Tunnel B (vertical, blue) -->
  <line x1="200" y1="20" x2="200" y2="120" stroke="var(--dia-cord, #1f57c4)" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="200" cy="20" r="3" fill="var(--dia-cord, #1f57c4)"/>
  <circle cx="200" cy="120" r="3" fill="var(--dia-cord, #1f57c4)"/>
  <text x="210" y="40" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-cord, #1f57c4)" font-weight="bold">[B]</text>

  <!-- Edge labels -->
  <text x="200" y="14" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">FRONT</text>
  <text x="200" y="137" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">BACK</text>
  <text x="90" y="55" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">LEFT</text>
  <text x="310" y="55" text-anchor="start" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">RIGHT</text>

  <!-- Cord still threaded through block (blue, subtle dashed line) -->
  <path d="M 95,80 L 305,80" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="350" y="82" text-anchor="start" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-cord, #1f57c4)">cord</text>

  <!-- Separation indicator (green) -->
  <path d="M 150,148 L 150,162" fill="none" stroke="var(--dia-pos, #2f8f43)" stroke-width="1.5" marker-end="url(#sArr)"/>
  <path d="M 250,148 L 250,162" fill="none" stroke="var(--dia-pos, #2f8f43)" stroke-width="1.5" marker-end="url(#sArr)"/>
  <text x="200" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-pos, #2f8f43)" font-weight="bold">freed</text>

  <!-- Ring 1 (free, below left, brass) -->
  <circle cx="140" cy="190" r="18" fill="none" stroke="var(--dia-ring, #b97d12)" stroke-width="2.5"/>
  <text x="140" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-ring, #b97d12)">Ring 1</text>

  <!-- Ring 2 (free, below right, brass) -->
  <circle cx="260" cy="190" r="18" fill="none" stroke="var(--dia-ring, #b97d12)" stroke-width="2.5"/>
  <text x="260" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-ring, #b97d12)">Ring 2</text>

  <!-- Labels -->
  <text x="200" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="var(--dia-pos, #2f8f43)" font-weight="bold">Both rings free</text>
  <text x="200" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-rigid, #8a8275)">Cord remains threaded (path has changed)</text>

  <defs>
    <marker id="sArr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0,0 L 8,3 L 0,6 Z" fill="var(--dia-pos, #2f8f43)"/>
    </marker>
  </defs>
</svg>