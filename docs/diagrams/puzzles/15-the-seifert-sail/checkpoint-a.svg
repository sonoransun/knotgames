<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350">
  <title>The Seifert Sail - Checkpoint A: Panels A and B Connected</title>
  <desc>Trefoil frame with panels A and B seated inside and joined by a brass half-twist connector at the upper-left crossing, while panel C waits outside the frame and the cord loop still hangs through the open lower-right region.</desc>

  <defs>
    <marker id="cpaSlide" markerWidth="8" markerHeight="6" refX="6" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0,0 L 8,3 L 0,6 Z" fill="var(--dia-rigid, #8a8275)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="150" y="25" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">The Seifert Sail — Checkpoint A</text>
  <text x="150" y="42" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-rigid, #8a8275)">panels A + B seated and connected — C still outside</text>

  <!-- Wooden base -->
  <rect x="30" y="260" width="160" height="20" rx="3" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>
  <line x1="30" y1="270" x2="190" y2="270" stroke="var(--dia-rigid, #8a8275)" stroke-width="0.5" stroke-dasharray="2,4"/>

  <!-- Mounting post (behind frame) -->
  <line x1="110" y1="199" x2="110" y2="260" stroke="var(--dia-rigid, #8a8275)" stroke-width="3"/>

  <!-- Trefoil wire frame: one continuous strand (x = sin t + 2 sin 2t, y = cos t - 2 cos 2t) -->
  <path d="M 110,126 C 113.8,126 117.6,126.2 121.3,126.7 C 125,127.1 128.7,127.8 132.3,128.7 C 135.9,129.6 139.4,130.8 142.7,132.1 C 146.1,133.4 149.3,134.9 152.3,136.6 C 155.3,138.3 158.2,140.2 160.8,142.1 C 163.4,144.1 165.9,146.3 168,148.5 C 170.2,150.7 172.1,153.1 173.8,155.5 C 175.4,157.9 176.8,160.4 177.9,162.9 C 179,165.4 179.9,167.9 180.4,170.4 C 180.9,172.9 181.2,175.4 181.1,177.7 C 181.1,180.1 180.8,182.5 180.2,184.7 C 179.6,186.9 178.7,189 177.5,191 C 176.4,193 175,194.8 173.4,196.4 C 171.8,198 169.9,199.5 167.9,200.7 C 165.8,202 163.5,203 161.1,203.8 C 158.7,204.5 156.1,205.1 153.4,205.4 C 150.7,205.7 147.8,205.7 144.9,205.5 C 142,205.2 139,204.8 136,204 C 133,203.2 129.9,202.2 126.9,200.9 C 123.8,199.7 120.8,198.1 117.8,196.3 C 114.9,194.6 111.9,192.5 109.1,190.3 C 106.3,188.1 103.6,185.6 101,182.9 C 98.4,180.3 96,177.4 93.7,174.4 C 91.5,171.4 89.4,168.3 87.5,165 C 85.6,161.7 83.9,158.3 82.4,154.9 C 81,151.4 79.7,147.9 78.7,144.3 C 77.7,140.8 76.9,137.2 76.4,133.6 C 75.9,130.1 75.6,126.5 75.5,123.1 C 75.4,119.6 75.6,116.2 76,112.9 C 76.5,109.7 77.1,106.5 78,103.5 C 78.8,100.5 79.9,97.6 81.2,95 C 82.4,92.4 83.9,89.9 85.5,87.7 C 87.1,85.5 88.9,83.6 90.7,81.9 C 92.6,80.2 94.6,78.7 96.7,77.5 C 98.8,76.4 101,75.5 103.2,74.9 C 105.4,74.3 107.7,74 110,74 C 112.3,74 114.6,74.3 116.8,74.9 C 119,75.5 121.2,76.4 123.3,77.5 C 125.4,78.7 127.4,80.2 129.3,81.9 C 131.1,83.6 132.9,85.5 134.5,87.7 C 136.1,89.9 137.6,92.4 138.8,95 C 140.1,97.6 141.2,100.5 142,103.5 C 142.9,106.5 143.5,109.7 144,112.9 C 144.4,116.2 144.6,119.6 144.5,123.1 C 144.4,126.5 144.1,130.1 143.6,133.6 C 143.1,137.2 142.3,140.8 141.3,144.3 C 140.3,147.9 139,151.4 137.6,154.9 C 136.1,158.3 134.4,161.7 132.5,165 C 130.6,168.3 128.5,171.4 126.3,174.4 C 124,177.4 121.6,180.3 119,182.9 C 116.4,185.6 113.7,188.1 110.9,190.3 C 108.1,192.5 105.1,194.6 102.2,196.3 C 99.2,198.1 96.2,199.7 93.1,200.9 C 90.1,202.2 87,203.2 84,204 C 81,204.8 78,205.2 75.1,205.5 C 72.2,205.7 69.3,205.7 66.6,205.4 C 63.9,205.1 61.3,204.5 58.9,203.8 C 56.5,203 54.2,202 52.1,200.7 C 50.1,199.5 48.2,198 46.6,196.4 C 45,194.8 43.6,193 42.5,191 C 41.3,189 40.4,186.9 39.8,184.7 C 39.2,182.5 38.9,180.1 38.9,177.7 C 38.8,175.4 39.1,172.9 39.6,170.4 C 40.1,167.9 41,165.4 42.1,162.9 C 43.2,160.4 44.6,157.9 46.2,155.5 C 47.9,153.1 49.8,150.7 52,148.5 C 54.1,146.3 56.6,144.1 59.2,142.1 C 61.8,140.2 64.7,138.3 67.7,136.6 C 70.7,134.9 73.9,133.4 77.3,132.1 C 80.6,130.8 84.1,129.6 87.7,128.7 C 91.3,127.8 95,127.1 98.7,126.7 C 102.4,126.2 106.2,126 110,126 Z"
        fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Crossing occlusions: surface-colored strokes along each over-strand tangent -->
  <line x1="115.5" y1="195.3" x2="104.5" y2="186.7" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8" stroke-linecap="round"/>
  <line x1="144.7" y1="125.6" x2="142.8" y2="139.4" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8" stroke-linecap="round"/>
  <line x1="69.7" y1="135.1" x2="82.7" y2="129.9" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8" stroke-linecap="round"/>

  <!-- Panel A: seated in the upper lobe -->
  <path d="M 76.2,132.5 C 76.1,130.7 75.5,125.4 75.5,122 C 75.5,118.5 75.7,115.1 76.2,111.9 C 76.6,108.7 77.3,105.5 78.2,102.5 C 79.1,99.6 80.3,96.8 81.6,94.2 C 82.8,91.6 84.3,89.2 86,87.1 C 87.6,84.9 89.4,83 91.3,81.3 C 93.2,79.7 95.3,78.3 97.4,77.2 C 99.5,76.1 101.7,75.2 103.9,74.7 C 106.2,74.2 108.5,73.9 110.7,74 C 113,74.1 115.3,74.4 117.5,75.1 C 119.7,75.7 121.9,76.7 123.9,77.9 C 126,79.1 128,80.6 129.9,82.4 C 131.7,84.2 133.5,86.2 135,88.4 C 136.6,90.7 138,93.2 139.2,95.8 C 140.4,98.5 141.5,101.4 142.3,104.4 C 143.1,107.4 143.7,110.7 144.1,113.9 C 144.4,117.2 144.5,121 144.5,124.1 C 144.4,127.2 143.9,131.1 143.8,132.5 L 143.8,132.5 C 142,131.9 137,130 133.4,129 C 129.9,128.1 126.2,127.3 122.5,126.8 C 118.8,126.3 115,126.1 111.2,126 C 107.4,126 103.6,126.1 99.9,126.6 C 96.1,127 92.4,127.6 88.8,128.5 C 85.2,129.3 80.4,131 78.3,131.7 C 76.2,132.3 76.6,132.4 76.2,132.5 Z"
        fill="var(--dia-cord, #1f57c4)" fill-opacity="0.12" stroke="none"/>

  <!-- Panel B: seated in the lower-left lobe -->
  <path d="M 110,191 C 108.5,192 104.2,195.2 101.2,196.9 C 98.3,198.6 95.2,200.1 92.2,201.3 C 89.1,202.6 86.1,203.5 83.1,204.2 C 80.1,204.9 77,205.4 74.2,205.5 C 71.3,205.7 68.4,205.6 65.8,205.3 C 63.1,204.9 60.5,204.3 58.1,203.5 C 55.8,202.7 53.5,201.6 51.5,200.3 C 49.5,199.1 47.7,197.6 46.1,195.9 C 44.5,194.2 43.2,192.4 42.1,190.4 C 41,188.4 40.2,186.2 39.7,184 C 39.1,181.8 38.8,179.4 38.9,177 C 38.9,174.6 39.2,172.1 39.8,169.6 C 40.4,167.1 41.3,164.6 42.4,162.1 C 43.6,159.6 45,157.1 46.8,154.8 C 48.5,152.4 50.4,150 52.7,147.8 C 54.9,145.6 57.3,143.5 60,141.5 C 62.7,139.6 65.9,137.6 68.6,136.1 C 71.3,134.6 75,133.1 76.2,132.5 L 76.2,132.5 C 76.6,134.3 77.4,139.7 78.4,143.2 C 79.4,146.7 80.6,150.3 82,153.8 C 83.4,157.2 85.1,160.7 86.9,164 C 88.7,167.3 90.8,170.5 93,173.5 C 95.2,176.5 97.7,179.4 100.2,182.1 C 102.7,184.8 106.6,188.1 108.2,189.6 C 109.9,191.1 109.7,190.8 110,191 Z"
        fill="var(--dia-cord, #1f57c4)" fill-opacity="0.12" stroke="none"/>

  <!-- Over-strand segments redrawn on top at each frame crossing (exact frame sub-paths) -->
  <path d="M 126.9,200.9 C 123.8,199.7 120.8,198.1 117.8,196.3 C 114.9,194.6 111.9,192.5 109.1,190.3 C 106.3,188.1 103.6,185.6 101,182.9 C 98.4,180.3 96,177.4 93.7,174.4" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 144,112.9 C 144.4,116.2 144.6,119.6 144.5,123.1 C 144.4,126.5 144.1,130.1 143.6,133.6 C 143.1,137.2 142.3,140.8 141.3,144.3 C 140.3,147.9 139,151.4 137.6,154.9" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 59.2,142.1 C 61.8,140.2 64.7,138.3 67.7,136.6 C 70.7,134.9 73.9,133.4 77.3,132.1 C 80.6,130.8 84.1,129.6 87.7,128.7 C 91.3,127.8 95,127.1 98.7,126.7" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Half-twist connector joining A and B (ring color, matching checkpoint-b/solved legend),
       straddling the upper-left crossing; dashed gold circle stays as the 'new connection' callout -->
  <path d="M 73.8,143.8 Q 78.2,133.7 84.8,124.7" fill="none" stroke="var(--dia-ring, #b97d12)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 67.7,140.3 Q 74.2,131.4 78.7,121.2" fill="none" stroke="var(--dia-ring, #b97d12)" stroke-width="2" stroke-linecap="round"/>
  <line x1="81.1" y1="129.6" x2="76.3" y2="126.8" stroke="var(--dia-ring, #b97d12)" stroke-width="1" stroke-dasharray="1.5,1.5"/>
  <circle cx="76.2" cy="132.5" r="15" fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="63.3" y1="124.9" x2="48" y2="113" stroke="var(--dia-rigid, #8a8275)" stroke-width="1"/>
  <text x="32" y="103" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-ring, #b97d12)">half-twist</text>
  <text x="32" y="113" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-ring, #b97d12)">connector</text>

  <!-- Cord loop: hangs through the still-open lower-right lobe, dipping behind the wire -->
  <path d="M 136,204 C 137,192 144,182 155,181.5 C 166,181 170,189 170.2,199.1"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.2" stroke-dasharray="5,3"/>
  <path d="M 170.2,199.1 C 170,210 165,220 154,221.5 C 143,223 136,214 136,204"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.2" stroke-dasharray="5,3" opacity="0.7"/>
  <!-- Wire passes over the cord at both dips: occlusion along the wire tangent, wire redrawn on top -->
  <line x1="142.8" y1="205.7" x2="129.2" y2="202.3" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 153.4,205.4 C 150.7,205.7 147.8,205.7 144.9,205.5 C 142,205.2 139,204.8 136,204 C 133,203.2 129.9,202.2 126.9,200.9 C 123.8,199.7 120.8,198.1 117.8,196.3" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="175.9" y1="195" x2="164.6" y2="203.3" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 177.5,191 C 176.4,193 175,194.8 173.4,196.4 C 171.8,198 169.9,199.5 167.9,200.7 C 165.8,202 163.5,203 161.1,203.8 C 158.7,204.5 156.1,205.1 153.4,205.4" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2.5" stroke-linecap="round"/>
  <text x="153" y="237" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-cord, #1f57c4)">cord — still linked</text>

  <!-- Panel letters -->
  <text x="110" y="100" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-cord, #1f57c4)" font-weight="bold">A</text>
  <text x="60" y="172" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-cord, #1f57c4)" font-weight="bold">B</text>

  <!-- Panel C: still outside the frame -->
  <path d="M 230,116 C 246,104 264,108 273,122 C 282,136 278,153 264,161 C 250,169 235,163 229,149 C 223,135 222,124 230,116 Z"
        fill="var(--dia-cord, #1f57c4)" fill-opacity="0.12" stroke="var(--dia-cord, #1f57c4)" stroke-width="1.2"/>
  <text x="251" y="140" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-cord, #1f57c4)" font-weight="bold">C</text>
  <text x="251" y="178" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-inksoft, #6a6151)">panel C (outside)</text>
  <path d="M 227,157 Q 207,167 191,172" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="1.2" marker-end="url(#cpaSlide)"/>
  <text x="212" y="151" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="7" fill="var(--dia-rigid, #8a8275)">slides in</text>

  <!-- Caption -->
  <rect x="25" y="298" width="250" height="40" rx="4" fill="var(--dia-wash, #ece3d0)" stroke="var(--dia-faint, #c9bda7)" stroke-width="0.5"/>
  <text x="150" y="314" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)">the connection carries a half-twist —</text>
  <text x="150" y="329" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)">the surface is one continuous sheet</text>
</svg>
