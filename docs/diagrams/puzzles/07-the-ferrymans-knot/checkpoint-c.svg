<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350">
  <title>Puzzle 7: Checkpoint C — Solved</title>
  <desc>After removing all wraps: the cord hangs freely alongside the post with no wraps remaining. The puzzle is solved.</desc>

  

  <!-- Step badge (upper-right) -->
  <circle cx="225" cy="25" r="16" fill="var(--dia-cord, #1f57c4)" opacity="0.12" stroke="var(--dia-cord, #1f57c4)" stroke-width="1.5"/>
  <text x="225" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="var(--dia-cord, #1f57c4)" font-weight="bold">Step</text>
  <text x="225" y="33" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-cord, #1f57c4)" font-weight="bold">3 of 3</text>

  <!-- Base block (dark wood) -->
  <rect x="65" y="280" width="120" height="40" rx="3" fill="var(--dia-ring, #b97d12)" stroke="var(--dia-ring, #b97d12)" stroke-width="2"/>

  <!-- Post (wood) -->
  <rect x="115" y="70" width="20" height="210" fill="var(--dia-wood, #b07d52)" stroke="var(--dia-wood, #b07d52)" stroke-width="2"/>

  <!-- Ball finial (wood) -->
  <circle cx="125" cy="55" r="15" fill="var(--dia-wood, #b07d52)" stroke="var(--dia-wood, #b07d52)" stroke-width="2"/>

  <!-- Ring on post (brass, trapped by finial) -->
  <circle cx="125" cy="110" r="8" fill="none" stroke="var(--dia-ring, #b97d12)" stroke-width="2.5"/>

  <!-- Hook at base (steel) -->
  <path d="M125,280 L125,290 Q125,305 115,305 Q105,305 105,295" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2.5"/>

  <!-- Cord hanging freely (alongside post) -->
  <line x1="150" y1="110" x2="150" y2="275" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-dasharray="5,3"/>
  <!-- Cord connects to ring -->
  <line x1="133" y1="110" x2="150" y2="110" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-dasharray="5,3"/>
  <!-- Cord connects to hook area -->
  <path d="M150,275 Q150,285 140,290 Q130,295 125,290" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-dasharray="5,3"/>

  <!-- === Label === -->
  <text x="125" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">SOLVED -- cord hangs freely</text>

  <!-- Checkmark annotation (green) -->
  <path d="M20,170 L30,180 L45,160" fill="none" stroke="var(--dia-pos, #2f8f43)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="15" y="200" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-pos, #2f8f43)">no wraps</text>
</svg>