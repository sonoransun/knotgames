<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350">
  <title>The Mirror Gate - Solved</title>
  <desc>Same base as setup, but each trefoil now seated over its matching recess: the red left-handed trefoil (all crossings negative) at the left red L recess and the blue right-handed trefoil (all crossings positive) at the right blue R recess. Crossings drawn with over/under gaps so the mirror chirality is visible.</desc>



  <!-- Wooden base -->
  <rect x="20" y="240" width="260" height="30" rx="3" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>
  <line x1="20" y1="255" x2="280" y2="255" stroke="var(--dia-rigid, #8a8275)" stroke-width="0.5" stroke-dasharray="2,4"/>

  <!-- Left recess (red — now holds left-handed trefoil) -->
  <rect x="40" y="244" width="60" height="22" rx="2" fill="var(--dia-neg, #cf3a26)" fill-opacity="0.1" stroke="var(--dia-neg, #cf3a26)" stroke-width="1.5"/>
  <text x="70" y="280" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9" fill="var(--dia-neg, #cf3a26)">L recess ✓</text>

  <!-- Right recess (blue — now holds right-handed trefoil) -->
  <rect x="200" y="244" width="60" height="22" rx="2" fill="var(--dia-cord, #1f57c4)" fill-opacity="0.1" stroke="var(--dia-cord, #1f57c4)" stroke-width="1.5"/>
  <text x="230" y="280" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9" fill="var(--dia-cord, #1f57c4)">R recess ✓</text>

  <!-- Center post -->
  <rect x="145" y="200" width="10" height="40" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>
  <circle cx="150" cy="197" r="5" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="1.5"/>

  <!-- Cord relaxed -->
  <path d="M 100,220 Q 125,210 145,220"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2" stroke-dasharray="5,3"/>
  <path d="M 155,220 Q 175,210 200,220"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Red trefoil (left-handed, all crossings negative) on LEFT side (correct!).
       Crossing idiom: continuous under-strand path, surface-colored occlusion stroke
       along the over strand's tangent, then the local over-segment drawn on top. -->
  <g transform="translate(70,150)">
    <!-- Continuous trefoil curve (under-strand everywhere) -->
    <path d="M 0,-11 C 4.6,-11 9.8,-10 13.8,-8.4 C 17.9,-6.8 21.9,-4.2 24.6,-1.5 C 27.2,1.2 29.1,4.8 29.8,7.8 C 30.4,10.8 29.9,14.1 28.6,16.5 C 27.2,18.9 24.6,21 21.6,21.9 C 18.7,22.8 14.7,22.9 11,22 C 7.3,21.1 3,19 -0.4,16.2 C -3.8,13.5 -7.2,9.5 -9.5,5.5 C -11.8,1.5 -13.6,-3.4 -14.2,-7.8 C -14.9,-12.1 -14.6,-16.9 -13.6,-20.5 C -12.5,-24.2 -10.4,-27.6 -8.2,-29.7 C -5.9,-31.8 -2.7,-33 0,-33 C 2.7,-33 5.9,-31.8 8.2,-29.7 C 10.4,-27.6 12.5,-24.2 13.6,-20.5 C 14.6,-16.9 14.9,-12.1 14.2,-7.8 C 13.6,-3.4 11.8,1.5 9.5,5.5 C 7.2,9.5 3.8,13.5 0.4,16.2 C -3,19 -7.3,21.1 -11,22 C -14.7,22.9 -18.7,22.8 -21.6,21.9 C -24.6,21 -27.2,18.9 -28.6,16.5 C -29.9,14.1 -30.4,10.8 -29.8,7.8 C -29.1,4.8 -27.2,1.2 -24.6,-1.5 C -21.9,-4.2 -17.9,-6.8 -13.8,-8.4 C -9.8,-10 -4.6,-11 0,-11 Z"
          fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>
    <!-- Crossing 1 (upper-right) -->
    <line x1="8.3" y1="-10.7" x2="20.3" y2="-5.8" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M 1.8,-11 C 2.5,-10.9 4.8,-10.7 6.3,-10.5 C 7.8,-10.2 9.3,-9.9 10.7,-9.5 C 12.2,-9.1 13.6,-8.6 14.9,-8 C 16.2,-7.4 17.5,-6.8 18.7,-6.1 C 19.9,-5.4 21,-4.6 22.1,-3.7 C 23.1,-2.9 24.4,-1.5 24.9,-1.1" fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>
    <!-- Crossing 2 (bottom) -->
    <line x1="5.1" y1="12.5" x2="-5.1" y2="20.5" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M 8.6,7 C 8.2,7.6 6.9,9.6 5.9,10.7 C 5,11.9 3.9,13 2.8,14 C 1.8,15.1 0.6,16 -0.5,16.9 C -1.7,17.8 -2.9,18.5 -4.1,19.2 C -5.3,19.9 -6.6,20.5 -7.8,21 C -9,21.5 -10.9,21.9 -11.5,22.1" fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>
    <!-- Crossing 3 (upper-left) -->
    <line x1="-13.4" y1="-1.8" x2="-15.2" y2="-14.7" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M -10.4,3.9 C -10.7,3.3 -11.7,1.2 -12.2,-0.2 C -12.8,-1.7 -13.2,-3.1 -13.6,-4.6 C -13.9,-6 -14.2,-7.5 -14.4,-8.9 C -14.5,-10.3 -14.6,-11.8 -14.6,-13.2 C -14.6,-14.5 -14.5,-15.9 -14.3,-17.2 C -14.1,-18.5 -13.6,-20.4 -13.4,-21" fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>
    <text x="0" y="38" text-anchor="middle" font-family="system-ui, sans-serif"
          font-size="9" fill="var(--dia-neg, #cf3a26)">L-trefoil</text>
  </g>

  <!-- Blue trefoil (right-handed, all crossings positive) on RIGHT side (correct!) -->
  <g transform="translate(230,150)">
    <!-- Continuous trefoil curve (under-strand everywhere) -->
    <path d="M 0,-11 C -4.6,-11 -9.8,-10 -13.8,-8.4 C -17.9,-6.8 -21.9,-4.2 -24.6,-1.5 C -27.2,1.2 -29.1,4.8 -29.8,7.8 C -30.4,10.8 -29.9,14.1 -28.6,16.5 C -27.2,18.9 -24.6,21 -21.6,21.9 C -18.7,22.8 -14.7,22.9 -11,22 C -7.3,21.1 -3,19 0.4,16.2 C 3.8,13.5 7.2,9.5 9.5,5.5 C 11.8,1.5 13.6,-3.4 14.2,-7.8 C 14.9,-12.1 14.6,-16.9 13.6,-20.5 C 12.5,-24.2 10.4,-27.6 8.2,-29.7 C 5.9,-31.8 2.7,-33 0,-33 C -2.7,-33 -5.9,-31.8 -8.2,-29.7 C -10.4,-27.6 -12.5,-24.2 -13.6,-20.5 C -14.6,-16.9 -14.9,-12.1 -14.2,-7.8 C -13.6,-3.4 -11.8,1.5 -9.5,5.5 C -7.2,9.5 -3.8,13.5 -0.4,16.2 C 3,19 7.3,21.1 11,22 C 14.7,22.9 18.7,22.8 21.6,21.9 C 24.6,21 27.2,18.9 28.6,16.5 C 29.9,14.1 30.4,10.8 29.8,7.8 C 29.1,4.8 27.2,1.2 24.6,-1.5 C 21.9,-4.2 17.9,-6.8 13.8,-8.4 C 9.8,-10 4.6,-11 0,-11 Z"
          fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
    <!-- Crossing 1 (upper-left) -->
    <line x1="-8.3" y1="-10.7" x2="-20.3" y2="-5.8" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M -1.8,-11 C -2.5,-10.9 -4.8,-10.7 -6.3,-10.5 C -7.8,-10.2 -9.3,-9.9 -10.7,-9.5 C -12.2,-9.1 -13.6,-8.6 -14.9,-8 C -16.2,-7.4 -17.5,-6.8 -18.7,-6.1 C -19.9,-5.4 -21,-4.6 -22.1,-3.7 C -23.1,-2.9 -24.4,-1.5 -24.9,-1.1" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
    <!-- Crossing 2 (bottom) -->
    <line x1="-5.1" y1="12.5" x2="5.1" y2="20.5" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M -8.6,7 C -8.2,7.6 -6.9,9.6 -5.9,10.7 C -5,11.9 -3.9,13 -2.8,14 C -1.8,15.1 -0.6,16 0.5,16.9 C 1.7,17.8 2.9,18.5 4.1,19.2 C 5.3,19.9 6.6,20.5 7.8,21 C 9,21.5 10.9,21.9 11.5,22.1" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
    <!-- Crossing 3 (upper-right) -->
    <line x1="13.4" y1="-1.8" x2="15.2" y2="-14.7" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M 10.4,3.9 C 10.7,3.3 11.7,1.2 12.2,-0.2 C 12.8,-1.7 13.2,-3.1 13.6,-4.6 C 13.9,-6 14.2,-7.5 14.4,-8.9 C 14.5,-10.3 14.6,-11.8 14.6,-13.2 C 14.6,-14.5 14.5,-15.9 14.3,-17.2 C 14.1,-18.5 13.6,-20.4 13.4,-21" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
    <text x="0" y="38" text-anchor="middle" font-family="system-ui, sans-serif"
          font-size="9" fill="var(--dia-cord, #1f57c4)">R-trefoil</text>
  </g>

  <!-- Check marks -->
  <text x="70" y="100" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="18" fill="var(--dia-pos, #2f8f43)">&#x2713;</text>
  <text x="230" y="100" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="18" fill="var(--dia-pos, #2f8f43)">&#x2713;</text>

  <!-- Title label -->
  <text x="150" y="25" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">The Mirror Gate — Solved</text>
  <text x="150" y="42" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-pos, #2f8f43)">Each trefoil in matching recess</text>

  <!-- Legend -->
  <line x1="20" y1="305" x2="50" y2="305" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>
  <text x="58" y="309" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">left-handed trefoil</text>

  <line x1="20" y1="320" x2="50" y2="320" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <text x="58" y="324" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">right-handed trefoil</text>

  <line x1="20" y1="335" x2="50" y2="335" stroke="var(--dia-cord, #1f57c4)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="58" y="339" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">flexible cord</text>
</svg>