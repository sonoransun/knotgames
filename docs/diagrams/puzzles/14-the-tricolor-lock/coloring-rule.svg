<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <title>Fox Coloring Rule</title>
  <desc>Three panels showing the Fox rule at a single crossing: all same color (valid), all different colors (valid), and two same one different (invalid). In each panel the over strand runs continuously across the crossing and the under strand shows a break. Below, a correctly tricolored trefoil with three alternating crossings, each drawn with the over strand continuous in its own color and verified with a check mark.</desc>

  <!-- Title -->
  <text x="200" y="22" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">Fox Tricoloring Rule</text>

  <!-- Panel separators -->
  <line x1="135" y1="30" x2="135" y2="145" stroke="var(--dia-faint, #c9bda7)" stroke-width="1"/>
  <line x1="270" y1="30" x2="270" y2="145" stroke="var(--dia-faint, #c9bda7)" stroke-width="1"/>

  <!-- === Panel 1: All same color (valid) === -->
  <text x="67" y="48" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">All same color</text>

  <!-- Under strand: continuous red -->
  <line x1="105" y1="65" x2="30" y2="130" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>
  <!-- Occlusion gap along the over strand's tangent -->
  <line x1="61.5" y1="92.3" x2="73.5" y2="102.7" stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
  <!-- Over strand drawn last: red -->
  <line x1="30" y1="65" x2="105" y2="130" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>

  <text x="67" y="142" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="16" fill="var(--dia-pos, #2f8f43)">&#x2713;</text>

  <!-- === Panel 2: All different colors (valid) === -->
  <text x="202" y="48" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">All different</text>

  <!-- Under strand: two segments meeting at the crossing (blue, then yellow) -->
  <line x1="240" y1="65" x2="202.5" y2="97.5" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <line x1="202.5" y1="97.5" x2="165" y2="130" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5"/>
  <!-- Occlusion gap along the over strand's tangent -->
  <line x1="196.5" y1="92.3" x2="208.5" y2="102.7" stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
  <!-- Over strand drawn last: red -->
  <line x1="165" y1="65" x2="240" y2="130" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>

  <text x="202" y="142" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="16" fill="var(--dia-pos, #2f8f43)">&#x2713;</text>

  <!-- === Panel 3: Two same, one different (INVALID) === -->
  <text x="335" y="48" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">Two same, one diff</text>

  <!-- Under strand: two segments meeting at the crossing (red, then blue) -->
  <line x1="375" y1="65" x2="337.5" y2="97.5" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>
  <line x1="337.5" y1="97.5" x2="300" y2="130" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <!-- Occlusion gap along the over strand's tangent -->
  <line x1="331.5" y1="92.3" x2="343.5" y2="102.7" stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
  <!-- Over strand drawn last: red -->
  <line x1="300" y1="65" x2="375" y2="130" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>

  <text x="335" y="142" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="16" fill="var(--dia-neg, #cf3a26)">&#x2717;</text>

  <!-- Divider line -->
  <line x1="20" y1="155" x2="380" y2="155" stroke="var(--dia-faint, #c9bda7)" stroke-width="1"/>

  <!-- === Bottom section: Colored trefoil === -->
  <text x="200" y="175" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">Valid Tricoloring of Trefoil</text>

  <!-- Trefoil: three arcs, each running from one undercrossing to the next.
       Arcs drawn first (continuous under strands), then per crossing an
       occlusion gap plus the over strand's segment redrawn in its own color. -->

  <!-- Arc 1 (red): bottom crossing, up the left side, over the left crossing, top lobe, down to the right crossing -->
  <path d="M 200,255 C 193.5,250.9 187.6,245.6 183.1,239.6 C 178.7,233.6 175.6,227 174.3,220.4 C 172.9,213.8 173.3,207.3 175.2,201.7 C 177,196.1 180.4,191.4 184.7,188.2 C 189,184.9 194.2,183.1 199.5,183 C 204.7,182.9 209.9,184.5 214.4,187.5 C 218.8,190.6 222.3,195.1 224.4,200.6 C 226.5,206 227.1,212.4 226,219"
        fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="3" stroke-linecap="round"/>

  <!-- Arc 2 (blue): right crossing, over the bottom crossing, bottom-left lobe, up to the left crossing -->
  <path d="M 226,219 C 224.9,225.6 222,232.3 217.8,238.4 C 213.5,244.5 207.8,249.9 201.4,254.1 C 194.9,258.4 187.7,261.4 180.7,262.8 C 173.7,264.3 166.9,264.4 161.3,263 C 155.6,261.6 151.1,258.9 148.3,255.4 C 145.6,251.8 144.6,247.4 145.7,242.8 C 146.8,238.2 150,233.5 154.8,229.3 C 159.7,225.1 166.4,221.5 174,219"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="3" stroke-linecap="round"/>

  <!-- Arc 3 (yellow): left crossing, over the right crossing, bottom-right lobe, down to the bottom crossing -->
  <path d="M 174,219 C 181.7,216.5 190.4,215.1 199.1,215 C 207.8,214.9 216.6,216.1 224.4,218.5 C 232.2,220.8 239,224.3 244.1,228.4 C 249.2,232.5 252.6,237.2 254,241.8 C 255.4,246.4 254.7,250.9 252.2,254.6 C 249.7,258.3 245.4,261.2 239.9,262.7 C 234.4,264.2 227.7,264.4 220.7,263.1 C 213.8,261.8 206.5,259.1 200,255"
        fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="3" stroke-linecap="round"/>

  <!-- Bottom crossing: blue over, red and yellow under -->
  <line x1="206.4" y1="251" x2="193.6" y2="259" stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
  <path d="M 209.5,247.7 C 206.6,250.5 203.4,252.9 200,255 C 196.6,257.1 193,258.9 189.4,260.3"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="3" stroke-linecap="round"/>

  <!-- Right crossing: yellow over, red and blue under -->
  <line x1="218.9" y1="216.7" x2="233.1" y2="221.3" stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
  <path d="M 213.9,216.1 C 218.1,216.8 222.2,217.8 226,219 C 229.8,220.2 233.3,221.8 236.5,223.5"
        fill="none" stroke="var(--dia-gold, #c79a22)" stroke-width="3" stroke-linecap="round"/>

  <!-- Left crossing: red over, blue and yellow under -->
  <line x1="175.3" y1="226.4" x2="172.8" y2="211.6" stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
  <path d="M 177.8,230.8 C 176,226.9 174.7,222.9 174,219 C 173.3,215.1 173.3,211.2 173.8,207.5"
        fill="none" stroke="var(--dia-neg, #cf3a26)" stroke-width="3" stroke-linecap="round"/>

  <!-- Checkmarks at each crossing -->
  <text x="200" y="269" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-pos, #2f8f43)">&#x2713;</text>
  <text x="244" y="221" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-pos, #2f8f43)">&#x2713;</text>
  <text x="156" y="221" text-anchor="end" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-pos, #2f8f43)">&#x2713;</text>

  <!-- Color labels -->
  <text x="238" y="192" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-neg, #cf3a26)">red</text>
  <text x="126" y="246" text-anchor="end" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-cord, #1f57c4)">blue</text>
  <text x="264" y="246" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-gold, #c79a22)">yellow</text>

  <!-- Legend -->
  <line x1="30" y1="280" x2="55" y2="280" stroke="var(--dia-neg, #cf3a26)" stroke-width="2.5"/>
  <text x="63" y="284" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">red arc</text>

  <line x1="130" y1="280" x2="155" y2="280" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  <text x="163" y="284" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">blue arc</text>

  <line x1="230" y1="280" x2="255" y2="280" stroke="var(--dia-gold, #c79a22)" stroke-width="2.5"/>
  <text x="263" y="284" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">yellow arc</text>
</svg>