<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 418">
  <title>Puzzle 18: The Whitehead Waltz — Solved State</title>
  <desc>Station B's cord loop lies free beside its ring, which still stands in its saddle — marked with a check. Station A is unchanged: its cord is still woven through the ring with the hooked clasp below, marked with a cross, because the true Whitehead link cannot be separated.</desc>

  <!-- Title -->
  <text x="310" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13"
        fill="var(--dia-ink, #24211a)" font-weight="bold">After the solve</text>

  <!-- ================= STATION A: still bound ================= -->
  <g transform="translate(10,30)">
    <!-- Stand -->
    <rect x="95" y="300" width="110" height="16" rx="3"
          fill="var(--dia-wash, #ece3d0)" stroke="var(--dia-rigid, #8a8275)" stroke-width="1.5"/>
    <path d="M141,300 L141,196 Q141,190 146,191 L150,187 L154,191 Q159,190 159,196 L159,300"
          fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>

    <!-- Ring -->
    <circle cx="150" cy="140" r="45" fill="none" stroke="var(--dia-ring, #b97d12)" stroke-width="3"/>

    <!-- Cord over ring at c2, c4: occlusions along the cord tangent -->
    <line x1="139" y1="193" x2="137" y2="173"
          stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
    <line x1="185" y1="159" x2="185" y2="178"
          stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>

    <!-- Cord loop, unchanged from setup -->
    <path d="M 120 248
             C 130 252 141 228 150 215
             C 156 206 160 195 162 183.4
             C 164 160 167 136 168 118
             C 169 106 180 106 181 118
             C 182 134 185 150 185 168.3
             C 186 195 190 225 180 246
             C 168 250 158 232 150 215
             C 143 204 139 194 138 183.4
             C 136 160 133 136 132 118
             C 131 106 120 106 119 118
             C 118 134 115 150 115 168.3
             C 112 192 108 228 120 248 Z"
          fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>

    <!-- Ring over cord at c1, c3 -->
    <line x1="111.2" y1="163.3" x2="118.8" y2="172.7"
          stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 106 149.4 A 45 45 0 0 0 126 178.1"
          fill="none" stroke="var(--dia-ring, #b97d12)" stroke-width="3"/>
    <line x1="156.2" y1="185" x2="167.8" y2="181.8"
          stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 150 185 A 45 45 0 0 0 176 176.7"
          fill="none" stroke="var(--dia-ring, #b97d12)" stroke-width="3"/>

    <!-- True clasp: hooked (lower-left-to-upper-right strand on top) -->
    <line x1="144.6" y1="222.2" x2="155.4" y2="207.8"
          stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 142 226 C 146 220 148 218 150 215 C 153 210 155 206 158 200"
          fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>

    <!-- Verdict -->
    <text x="232" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="40"
          font-weight="bold" fill="var(--dia-neg, #cf3a26)">✗</text>
    <text x="150" y="338" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12"
          font-weight="bold" fill="var(--dia-inksoft, #6a6151)">STATION A — still bound</text>
    <text x="150" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5"
          fill="var(--dia-inksoft, #6a6151)">the clasp holds; no manipulation frees it</text>
  </g>

  <!-- ================= STATION B: cord free ================= -->
  <g transform="translate(310,30)">
    <!-- Stand -->
    <rect x="95" y="300" width="110" height="16" rx="3"
          fill="var(--dia-wash, #ece3d0)" stroke="var(--dia-rigid, #8a8275)" stroke-width="1.5"/>
    <path d="M141,300 L141,196 Q141,190 146,191 L150,187 L154,191 Q159,190 159,196 L159,300"
          fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>

    <!-- Ring, empty -->
    <circle cx="150" cy="140" r="45" fill="none" stroke="var(--dia-ring, #b97d12)" stroke-width="3"/>

    <!-- Freed cord loop lying beside the stand -->
    <ellipse cx="232" cy="298" rx="46" ry="14" transform="rotate(-12 232 298)"
             fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
    <line x1="238" y1="276" x2="252" y2="250" stroke="var(--dia-faint, #c9bda7)" stroke-width="1"/>
    <text x="254" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5"
          fill="var(--dia-inksoft, #6a6151)">a plain loop again</text>

    <!-- Verdict -->
    <text x="232" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="42"
          font-weight="bold" fill="var(--dia-pos, #2f8f43)">✓</text>
    <text x="150" y="338" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12"
          font-weight="bold" fill="var(--dia-inksoft, #6a6151)">STATION B — cord free</text>
    <text x="150" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5"
          fill="var(--dia-inksoft, #6a6151)">the unlink, exactly as the count allowed</text>
  </g>

  <!-- Footer -->
  <text x="310" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10"
        fill="var(--dia-rigid, #8a8275)">Same linking number, opposite fates: lk = 0 was necessary for B's escape — and powerless to grant A one.</text>
</svg>
