<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440">
  <title>Puzzle 18: Linking Number Zero on Both Stations</title>
  <desc>Both stations' link diagrams with orientations marked. The four ring-cord crossings are signed +1, +1, −1, −1 reading left to right, so the sum is 0 and the linking number is half of 0, which is 0 — on Station A and Station B alike. The clasp is a self-crossing of the cord and is not counted. The only difference between the diagrams is which strand is on top at the clasp.</desc>

  <defs>
    <!-- Link diagram (ring center (150,140), r=45) with orientation arrows and signed
         crossings; everything except the clasp patch, which differs per station. -->
    <g id="ww-lk-station">
      <!-- Ring (under-strand at c2/c4) -->
      <circle cx="150" cy="140" r="45" fill="none" stroke="var(--dia-ring, #b97d12)" stroke-width="3"/>

      <!-- Occlusions along the cord tangent where the cord is over (c2, c4) -->
      <line x1="139" y1="193" x2="137" y2="173"
            stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
      <line x1="185" y1="159" x2="185" y2="178"
            stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>

      <!-- Cord loop (same weave as the physical setup) -->
      <path d="M 120 248
               C 130 252 141 228 150 215
               C 156 206 160 195 162 183.4
               C 164 160 167 136 168 118
               C 169 106 180 106 181 118
               C 182 134 185 150 185 168.3
               C 186 195 190 225 180 246
               C 168 250 158 232 150 215
               C 143 204 139 194 138 183.4
               C 136 160 133 136 132 118
               C 131 106 120 106 119 118
               C 118 134 115 150 115 168.3
               C 112 192 108 228 120 248 Z"
            fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>

      <!-- Ring over cord at c1 and c3: occlusion along ring tangent + ring arc on top -->
      <line x1="111.2" y1="163.3" x2="118.8" y2="172.7"
            stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
      <path d="M 106 149.4 A 45 45 0 0 0 126 178.1"
            fill="none" stroke="var(--dia-ring, #b97d12)" stroke-width="3"/>
      <line x1="156.2" y1="185" x2="167.8" y2="181.8"
            stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
      <path d="M 150 185 A 45 45 0 0 0 176 176.7"
            fill="none" stroke="var(--dia-ring, #b97d12)" stroke-width="3"/>

      <!-- Orientation arrows: ring clockwise (arrow at top points right);
           cord traversed downward on the outer-left strand -->
      <polygon points="144,90 156,95 144,100" fill="var(--dia-ring, #b97d12)"/>
      <polygon points="105,203 113,203 109,212" fill="var(--dia-cord, #1f57c4)"/>

      <!-- Signed crossings -->
      <circle cx="115" cy="168.3" r="8" fill="none" stroke="var(--dia-faint, #c9bda7)"
              stroke-width="1" stroke-dasharray="3,2"/>
      <circle cx="138" cy="183.4" r="8" fill="none" stroke="var(--dia-faint, #c9bda7)"
              stroke-width="1" stroke-dasharray="3,2"/>
      <circle cx="162" cy="183.4" r="8" fill="none" stroke="var(--dia-faint, #c9bda7)"
              stroke-width="1" stroke-dasharray="3,2"/>
      <circle cx="185" cy="168.3" r="8" fill="none" stroke="var(--dia-faint, #c9bda7)"
              stroke-width="1" stroke-dasharray="3,2"/>
      <text x="92" y="163" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11"
            font-weight="bold" fill="var(--dia-pos, #2f8f43)">+1</text>
      <text x="130" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11"
            font-weight="bold" fill="var(--dia-pos, #2f8f43)">+1</text>
      <text x="171" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11"
            font-weight="bold" fill="var(--dia-neg, #cf3a26)">−1</text>
      <text x="210" y="163" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11"
            font-weight="bold" fill="var(--dia-neg, #cf3a26)">−1</text>

      <!-- Clasp: highlighted but unsigned -->
      <circle cx="150" cy="215" r="11" fill="none" stroke="var(--dia-gold, #c79a22)"
              stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="150" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5"
            fill="var(--dia-inksoft, #6a6151)">the clasp is a self-crossing of the cord — not counted in lk</text>

      <!-- Sum box -->
      <rect x="55" y="278" width="190" height="46" rx="6"
            fill="var(--dia-wash, #ece3d0)" stroke="var(--dia-faint, #c9bda7)" stroke-width="1"/>
      <text x="150" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11"
            fill="var(--dia-ink, #24211a)">(+1) + (+1) + (−1) + (−1) = 0</text>
      <text x="150" y="314" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11"
            font-weight="bold" fill="var(--dia-ink, #24211a)">lk = ½ × 0 = 0</text>
    </g>
  </defs>

  <!-- Title -->
  <text x="310" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13"
        fill="var(--dia-ink, #24211a)" font-weight="bold">The same arithmetic, twice</text>

  <!-- Station A -->
  <g transform="translate(10,40)">
    <text x="150" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12"
          font-weight="bold" fill="var(--dia-inksoft, #6a6151)">STATION A — clasp hooks</text>
    <use href="#ww-lk-station"/>
    <!-- Clasp: lower-left-to-upper-right strand on top -->
    <line x1="144.6" y1="222.2" x2="155.4" y2="207.8"
          stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 142 226 C 146 220 148 218 150 215 C 153 210 155 206 158 200"
          fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  </g>

  <!-- Station B -->
  <g transform="translate(320,40)">
    <text x="150" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12"
          font-weight="bold" fill="var(--dia-inksoft, #6a6151)">STATION B — clasp flipped</text>
    <use href="#ww-lk-station"/>
    <!-- Clasp: lower-right-to-upper-left strand on top -->
    <line x1="153.9" y1="223.1" x2="146.1" y2="206.9"
          stroke="var(--dia-surface, #fbf7ee)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 158 228 C 154 222 152 219 150 215 C 148 211 145 207 142 202"
          fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5"/>
  </g>

  <!-- Footer -->
  <text x="310" y="404" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10"
        fill="var(--dia-rigid, #8a8275)">Each pass through the aperture contributes two crossings of one sign: +1 +1 for the front-to-back pass,</text>
  <text x="310" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10"
        fill="var(--dia-rigid, #8a8275)">−1 −1 for the back-to-front pass. lk = 0 on both stations — yet only one cord comes free.</text>
</svg>
