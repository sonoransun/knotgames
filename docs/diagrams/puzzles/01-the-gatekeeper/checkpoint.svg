<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <title>The Gatekeeper - Checkpoint</title>
  <desc>Intermediate state: the U-bar with the cord partially bunched near one tip. The ring has been slid to the drape point, with slack bunched up on one side.</desc>

  <defs>
    <!-- Directional arrow marker for cord -->
    <marker id="cordArrow" markerWidth="6" markerHeight="4" refX="3" refY="2"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0,0 L 6,2 L 0,4 Z" fill="var(--dia-cord, #1f57c4)"/>
    </marker>
  </defs>

  

  <!-- U-bar -->
  <path d="M 100,40 L 100,190 Q 100,240 150,240 Q 200,240 200,190 L 200,40"
        fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2" stroke-linecap="round"/>

  <!-- Tip labels -->
  <text x="100" y="30" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">L</text>
  <text x="200" y="30" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">R</text>

  <!-- Cord: bunched/slack on the left side near L tip (smoothed organic curves) -->
  <path d="M 100,40 Q 97,55 103,65 Q 110,76 97,88 Q 86,98 100,110"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Arrow along bunched cord -->
  <path d="M 98,52 L 102,62"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2" marker-end="url(#cordArrow)"/>

  <!-- Ring slid to drape point near L arm -->
  <circle cx="110" cy="120" r="16" fill="none" stroke="var(--dia-ring, #b97d12)" stroke-width="2"/>

  <!-- Cord continues from ring down around curve and up to R -->
  <path d="M 110,136 Q 120,180 150,230 Q 155,238 160,230 Q 180,170 200,40"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Arrow along lower cord -->
  <path d="M 130,180 L 140,205"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2" marker-end="url(#cordArrow)"/>
  <!-- Arrow along upper cord -->
  <path d="M 188,110 L 194,80"
        fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2" marker-end="url(#cordArrow)"/>

  <!-- Annotation: slack -->
  <path d="M 70,70 L 88,70" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="1"/>
  <text x="58" y="74" text-anchor="end" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-rigid, #8a8275)">slack</text>

  <!-- Annotation: ring position -->
  <line x1="135" y1="115" x2="155" y2="115" stroke="var(--dia-rigid, #8a8275)" stroke-width="1"/>
  <text x="158" y="119" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-rigid, #8a8275)">ring at drape point</text>

  <!-- Step badge: Step 2 -->
  <circle cx="272" cy="24" r="14" fill="var(--dia-surface, #fbf7ee)" stroke="var(--dia-cord, #1f57c4)" stroke-width="2"/>
  <text x="272" y="21" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8" fill="var(--dia-cord, #1f57c4)" font-weight="bold">Step</text>
  <text x="272" y="31" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-cord, #1f57c4)" font-weight="bold">2</text>
</svg>
