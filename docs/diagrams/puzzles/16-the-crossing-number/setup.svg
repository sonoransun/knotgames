<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350">
  <title>The Crossing Number - Setup</title>
  <desc>Standard alternating figure-eight knot diagram made of steel rod, with 4 crossings at the north, east, south and west of the knot. Breaks in the strand show which strand passes under at each crossing, and the crossings alternate over-under along the wire. Each crossing has a removable pin, shown as a labeled circle (A, B, C, D) offset from the crossing and connected by a thin leader line. A ring is threaded on the upper-left arc of the wire. Wooden base below. Caption: one flip will unknot this; predict the moves it unlocks first.</desc>

  <!--
    Geometry: standard alternating figure-eight (4_1) diagram from the
    parametrization  x = (2 + cos 2t) cos 3t,  y = (2 + cos 2t) sin 3t,
    z = sin 4t  (same construction as theory/topology-primer/
    unknotting-crossing-change.svg). Scale 23, center (150,145).
    Crossings sit at the compass points: A = north, B = east, C = south,
    D = west. Tracing the strand gives the alternating Gauss code
    OA UD OB UA OC UB OD UC.
    Every crossing uses the occlusion idiom (see crossingGap in lib/svg.js):
    continuous base curve, then a surface-colored round-linecap stroke laid
    along the over strand's tangent, then the over-segment redrawn on top.
  -->

  <!-- Title -->
  <text x="150" y="25" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">The Crossing Number &#x2014; Setup</text>
  <text x="150" y="42" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-rigid, #8a8275)">figure-eight knot, 4 crossings, alternating</text>

