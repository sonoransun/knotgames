<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <title>Crossing Options</title>
  <desc>Table showing the result of flipping each crossing of the figure-eight knot's minimal diagram: every one of the four flips (A, B, C, D) yields the unknot and frees the ring. Flipping A or C opens the outer-shell clasp whose corners are crossings A and C; flipping B or D opens the central-eye clasp whose corners are B and D. Each route is a Reidemeister II slide that removes the opened clasp's two crossings, followed by two Reidemeister I untwists. Row C is highlighted as the worked example used in the text. Caption: on this diagram every flip works, so predict the route before you flip.</desc>

  <!--
    No result-knot minis needed anymore: every flip yields the unknot
    (verified independently by Kauffman bracket and by the R-move structure
    of the Gauss code OA UD OB UA OC UB OD UC). The diagram's two bigon
    faces are the outer shell (corners A, C) and the central eye (corners
    B, D); flipping either corner of a bigon opens that clasp for R-II,
    after which the two surviving crossings untwist by R-I.
  -->

  <!-- Title -->
  <text x="200" y="22" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">Crossing Flip Options</text>

  <!-- Header row -->
  <rect x="20" y="35" width="360" height="22" fill="var(--dia-faint, #c9bda7)" stroke="var(--dia-faint, #c9bda7)" stroke-width="0.5"/>
  <text x="45" y="50" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">Flip</text>
  <text x="140" y="50" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">Clasp it opens</text>
  <text x="262" y="50" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">Route</text>
  <text x="352" y="50" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">Result</text>

  <!-- Row 1: Flip A -->
  <rect x="20" y="57" width="360" height="38" fill="none" stroke="var(--dia-faint, #c9bda7)" stroke-width="0.5"/>
  <text x="45" y="80" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-neg, #cf3a26)" font-weight="bold">A</text>
  <text x="140" y="80" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9.5" fill="var(--dia-inksoft, #6a6151)">outer shell (A&#x2013;C)</text>
  <text x="262" y="80" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9.5" fill="var(--dia-inksoft, #6a6151)">R-II, then R-I &#xD7; 2</text>
  <circle cx="323" cy="76" r="7" fill="none" stroke="var(--dia-pos, #2f8f43)" stroke-width="1.8"/>
  <text x="358" y="80" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9.5" fill="var(--dia-pos, #2f8f43)">unknot &#x2713;</text>

  <!-- Row 2: Flip B -->
  <rect x="20" y="95" width="360" height="38" fill="none" stroke="var(--dia-faint, #c9bda7)" stroke-width="0.5"/>
  <text x="45" y="118" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-neg, #cf3a26)" font-weight="bold">B</text>
  <text x="140" y="118" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9.5" fill="var(--dia-inksoft, #6a6151)">central eye (B&#x2013;D)</text>
  <text x="262" y="118" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9.5" fill="var(--dia-inksoft, #6a6151)">R-II, then R-I &#xD7; 2</text>
  <circle cx="323" cy="114" r="7" fill="none" stroke="var(--dia-pos, #2f8f43)" stroke-width="1.8"/>
  <text x="358" y="118" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9.5" fill="var(--dia-pos, #2f8f43)">unknot &#x2713;</text>

  <!-- Row 3: Flip C (the worked example in the text) -->
  <rect x="20" y="133" width="360" height="38" fill="var(--dia-wash, #ece3d0)" stroke="var(--dia-pos, #2f8f43)" stroke-width="1.5"/>
  <text x="45" y="156" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-pos, #2f8f43)" font-weight="bold">C</text>
  <text x="140" y="156" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9.5" fill="var(--dia-inksoft, #6a6151)">outer shell (A&#x2013;C)</text>
  <text x="262" y="156" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9.5" fill="var(--dia-inksoft, #6a6151)">R-II, then R-I &#xD7; 2</text>
  <circle cx="323" cy="152" r="7" fill="none" stroke="var(--dia-pos, #2f8f43)" stroke-width="1.8"/>
  <text x="358" y="156" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9.5" fill="var(--dia-pos, #2f8f43)" font-weight="bold">unknot &#x2713;</text>

  <!-- Row 4: Flip D -->
  <rect x="20" y="171" width="360" height="38" fill="none" stroke="var(--dia-faint, #c9bda7)" stroke-width="0.5"/>
  <text x="45" y="194" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-neg, #cf3a26)" font-weight="bold">D</text>
  <text x="140" y="194" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9.5" fill="var(--dia-inksoft, #6a6151)">central eye (B&#x2013;D)</text>
  <text x="262" y="194" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9.5" fill="var(--dia-inksoft, #6a6151)">R-II, then R-I &#xD7; 2</text>
  <circle cx="323" cy="190" r="7" fill="none" stroke="var(--dia-pos, #2f8f43)" stroke-width="1.8"/>
  <text x="358" y="194" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9.5" fill="var(--dia-pos, #2f8f43)">unknot &#x2713;</text>

  <!-- Conclusion box -->
  <rect x="30" y="222" width="340" height="28" rx="4" fill="var(--dia-wash, #ece3d0)" stroke="var(--dia-faint, #c9bda7)" stroke-width="0.5"/>
  <text x="200" y="240" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-inksoft, #6a6151)">u(figure-eight) = 1 &#x2014; every flip of this diagram realizes it</text>

  <!-- Lesson / legend -->
  <text x="200" y="268" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" fill="var(--dia-pos, #2f8f43)" font-weight="bold">On this diagram, every flip works &#x2014; predict the route before you flip</text>
  <text x="200" y="283" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8.5" fill="var(--dia-rigid, #8a8275)">highlighted row = the worked example (C); circle = the unknotted frame, ring free</text>
  <text x="200" y="295" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="8.5" fill="var(--dia-rigid, #8a8275)">flip A or C &#x2192; the outer shell slides off; flip B or D &#x2192; the central eye opens</text>
</svg>
