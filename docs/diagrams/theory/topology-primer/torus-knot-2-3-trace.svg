<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320">
  <title>The (2,3) Torus Knot on a Flat Torus</title>
  <desc>A torus drawn flat as two concentric ellipses with the (2,3) torus-knot curve traced on it: the cord wraps 3 times around the tube (dipping to the underside at the inner rim) while passing 2 times around the hole, crossing itself exactly 3 times with the same handedness — a trefoil.</desc>

  <!-- Geometry: curve rho(t) = 110 + 50*cos(1.5t), t in [0,4pi], centred at (205,178),
       y squashed by 0.625. Two laps around the hole (p = 2), meridian angle wraps
       three times (q = 3). Projection has exactly 3 crossings, 120 degrees apart,
       at mid-annulus radius; top-of-torus branch is always the over strand. -->

  <!-- ===== Title ===== -->
  <text x="310" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="var(--dia-inksoft, #6a6151)" font-weight="bold">The (2,3) Torus Knot on a Flat Torus</text>
  <text x="310" y="41" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-rigid, #8a8275)">torus seen from above — the cord makes 3 tube wraps and 2 hole passes, crossing itself 3 times</text>

  <!-- ===== Torus (flat view): outer edge + hole ===== -->
  <ellipse cx="205" cy="178" rx="160" ry="100" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>
  <ellipse cx="205" cy="178" rx="60" ry="37.5" fill="none" stroke="var(--dia-rigid, #8a8275)" stroke-width="2"/>
  <text x="205" y="181" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="var(--dia-inksoft, #6a6151)">hole</text>

  <!-- Counting spoke for p: a fixed radial line; the cord crosses it exactly twice -->
  <line x1="205" y1="215.5" x2="205" y2="278" stroke="var(--dia-faint, #c9bda7)" stroke-width="1.2" stroke-dasharray="2,3"/>

  <!-- ===== Cord, underside arcs (dashed = on the bottom of the torus) =====
       Continuous under-strands drawn first (occlusion idiom, layer 1). -->
  <path d="M 175.0,210.5 C 172.5,209.8 165.7,207.7 159.9,206.2 C 154.1,204.7 147.5,203.6 140.4,201.3 C 133.2,199.1 124.8,196.6 117.2,192.7 C 109.7,188.8 101.2,183.9 95.0,178.0 C 88.8,172.1 82.9,164.7 80.3,157.1 C 77.6,149.5 76.7,140.6 79.1,132.6 C 81.5,124.6 86.9,115.8 94.6,109.0 C 102.2,102.1 119.9,94.3 125.0,91.4" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5,3" opacity="0.75"/>
  <path d="M 265.0,178.0 C 265.3,179.7 265.9,184.4 266.6,188.3 C 267.4,192.2 269.2,196.4 269.6,201.3 C 270.1,206.3 270.9,212.1 269.3,218.2 C 267.6,224.2 265.1,231.2 260.0,237.5 C 254.9,243.8 247.6,250.7 238.4,256.0 C 229.3,261.2 217.3,266.1 205.0,268.8 C 192.7,271.6 177.9,273.0 164.6,272.3 C 151.2,271.6 131.6,265.9 125.0,264.6" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5,3" opacity="0.75"/>
  <path d="M 175.0,145.5 C 177.2,144.5 183.5,141.8 188.5,139.5 C 193.5,137.1 198.3,134.1 205.0,131.3 C 211.7,128.6 219.4,125.3 228.5,123.1 C 237.7,121.0 248.7,118.8 260.0,118.5 C 271.3,118.1 284.5,118.6 296.3,120.9 C 308.1,123.3 321.0,127.3 330.9,132.6 C 340.8,137.9 350.2,145.2 355.9,152.7 C 361.6,160.3 363.5,173.8 365.0,178.0" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5,3" opacity="0.75"/>

  <!-- ===== Occlusion gaps at the 3 crossings (layer 2) =====
       Surface-coloured strokes along the OVER strand's tangent. -->
  <line x1="267.5" y1="237.9" x2="252.5" y2="237.2" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <line x1="255.4" y1="112.5" x2="264.6" y2="124.4" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>
  <line x1="89.5" y1="183.1" x2="100.5" y2="172.9" stroke="var(--dia-surface, #fbf7ee)" stroke-width="8.5" stroke-linecap="round"/>

  <!-- ===== Cord, top-side arcs (solid = on top of the torus, layer 3) ===== -->
  <path d="M 365.0,178.0 C 363.5,182.2 361.6,195.7 355.9,203.3 C 350.2,210.8 340.8,218.1 330.9,223.4 C 321.0,228.7 308.1,232.7 296.3,235.1 C 284.5,237.4 271.3,237.9 260.0,237.5 C 248.7,237.2 237.7,235.0 228.5,232.9 C 219.4,230.7 211.7,227.4 205.0,224.7 C 198.3,221.9 193.5,218.9 188.5,216.5 C 183.5,214.2 177.2,211.5 175.0,210.5" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 125.0,91.4 C 131.6,90.1 151.2,84.4 164.6,83.7 C 177.9,83.0 192.7,84.4 205.0,87.2 C 217.3,89.9 229.3,94.8 238.4,100.0 C 247.6,105.3 254.9,112.2 260.0,118.5 C 265.1,124.8 267.6,131.8 269.3,137.8 C 270.9,143.9 270.1,149.7 269.6,154.7 C 269.2,159.6 267.4,163.8 266.6,167.7 C 265.9,171.6 265.3,176.3 265.0,178.0" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 125.0,264.6 C 119.9,261.7 102.2,253.9 94.6,247.0 C 86.9,240.2 81.5,231.4 79.1,223.4 C 76.7,215.4 77.6,206.5 80.3,198.9 C 82.9,191.3 88.8,183.9 95.0,178.0 C 101.2,172.1 109.7,167.2 117.2,163.3 C 124.8,159.4 133.2,156.9 140.4,154.7 C 147.5,152.4 154.1,151.3 159.9,149.8 C 165.7,148.3 172.5,146.2 175.0,145.5" fill="none" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Direction of travel arrowheads (one per top arc) -->
  <polygon points="325.8,225.9 332.5,218.9 335.5,225.5" fill="var(--dia-cord, #1f57c4)"/>
  <polygon points="205.0,87.2 195.4,88.7 197.0,81.6" fill="var(--dia-cord, #1f57c4)"/>
  <polygon points="78.6,221.4 84.1,229.4 77.1,231.0" fill="var(--dia-cord, #1f57c4)"/>

  <!-- ===== The 3 self-crossings, circled (all the same handedness) ===== -->
  <circle cx="260" cy="237.5" r="12" fill="none" stroke="var(--dia-pos, #2f8f43)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="260" cy="118.5" r="12" fill="none" stroke="var(--dia-pos, #2f8f43)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="95" cy="178" r="12" fill="none" stroke="var(--dia-pos, #2f8f43)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ===== Tube-wrap badges 1..3 (ring token) at the dips over the inner rim ===== -->
  <line x1="184.5" y1="200.2" x2="175.0" y2="210.5" stroke="var(--dia-rigid, #8a8275)" stroke-width="1"/>
  <circle cx="184.5" cy="200.2" r="8" fill="var(--dia-surface, #fbf7ee)" stroke="var(--dia-ring, #b97d12)" stroke-width="1.8"/>
  <text x="184.5" y="203.7" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="var(--dia-ring, #b97d12)">1</text>

  <line x1="251" y1="178" x2="265" y2="178" stroke="var(--dia-rigid, #8a8275)" stroke-width="1"/>
  <circle cx="251" cy="178" r="8" fill="var(--dia-surface, #fbf7ee)" stroke="var(--dia-ring, #b97d12)" stroke-width="1.8"/>
  <text x="251" y="181.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="var(--dia-ring, #b97d12)">2</text>

  <line x1="184.5" y1="155.8" x2="175.0" y2="145.5" stroke="var(--dia-rigid, #8a8275)" stroke-width="1"/>
  <circle cx="184.5" cy="155.8" r="8" fill="var(--dia-surface, #fbf7ee)" stroke="var(--dia-ring, #b97d12)" stroke-width="1.8"/>
  <text x="184.5" y="159.3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="var(--dia-ring, #b97d12)">3</text>

  <!-- ===== Hole-pass badges 1..2 (cord token) where the cord crosses the spoke ===== -->
  <circle cx="205" cy="224.7" r="7.5" fill="var(--dia-surface, #fbf7ee)" stroke="var(--dia-cord, #1f57c4)" stroke-width="1.8"/>
  <text x="205" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="var(--dia-cord, #1f57c4)">1</text>

  <circle cx="205" cy="268.8" r="7.5" fill="var(--dia-surface, #fbf7ee)" stroke="var(--dia-cord, #1f57c4)" stroke-width="1.8"/>
  <text x="205" y="272.1" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="var(--dia-cord, #1f57c4)">2</text>

  <!-- ===== Start/finish marker: the trace closes after one traversal ===== -->
  <circle cx="365" cy="178" r="3.5" fill="var(--dia-ink, #24211a)"/>
  <line x1="368" y1="182" x2="386" y2="214" stroke="var(--dia-faint, #c9bda7)" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="388" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="var(--dia-inksoft, #6a6151)">start = finish</text>

  <!-- Caption for the counting spoke -->
  <text x="205" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="var(--dia-inksoft, #6a6151)">count p on the dotted spoke — the cord crosses it exactly 2 times</text>

  <!-- ===== Legend (right column) ===== -->
  <text x="398" y="74" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="var(--dia-inksoft, #6a6151)">How to read the trace</text>

  <line x1="398" y1="89" x2="424" y2="89" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round"/>
  <text x="430" y="92" font-family="system-ui, sans-serif" font-size="9.5" fill="var(--dia-inksoft, #6a6151)">cord on top of the torus</text>

  <line x1="398" y1="107" x2="424" y2="107" stroke="var(--dia-cord, #1f57c4)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5,3" opacity="0.75"/>
  <text x="430" y="110" font-family="system-ui, sans-serif" font-size="9.5" fill="var(--dia-inksoft, #6a6151)">cord on the underside</text>

  <circle cx="411" cy="126" r="7" fill="var(--dia-surface, #fbf7ee)" stroke="var(--dia-ring, #b97d12)" stroke-width="1.8"/>
  <text x="411" y="129.3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-ring, #b97d12)">1</text>
  <text x="430" y="124" font-family="system-ui, sans-serif" font-size="9.5" fill="var(--dia-inksoft, #6a6151)">tube wraps 1&#8211;3 — the short way,</text>
  <text x="430" y="136" font-family="system-ui, sans-serif" font-size="9.5" fill="var(--dia-inksoft, #6a6151)">around the tube (q = 3)</text>

  <circle cx="411" cy="156" r="7" fill="var(--dia-surface, #fbf7ee)" stroke="var(--dia-cord, #1f57c4)" stroke-width="1.8"/>
  <text x="411" y="159.3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="var(--dia-cord, #1f57c4)">1</text>
  <text x="430" y="154" font-family="system-ui, sans-serif" font-size="9.5" fill="var(--dia-inksoft, #6a6151)">hole passes 1&#8211;2 — the long way,</text>
  <text x="430" y="166" font-family="system-ui, sans-serif" font-size="9.5" fill="var(--dia-inksoft, #6a6151)">around the hole (p = 2)</text>

  <circle cx="411" cy="186" r="7" fill="none" stroke="var(--dia-pos, #2f8f43)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="430" y="184" font-family="system-ui, sans-serif" font-size="9.5" fill="var(--dia-inksoft, #6a6151)">self-crossing — 3 in total,</text>
  <text x="430" y="196" font-family="system-ui, sans-serif" font-size="9.5" fill="var(--dia-inksoft, #6a6151)">all with the same handedness</text>

  <!-- ===== Key annotation ===== -->
  <rect x="398" y="246" width="214" height="62" rx="4" fill="var(--dia-wash, #ece3d0)" stroke="var(--dia-ring, #b97d12)" stroke-width="1"/>
  <text x="505" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="var(--dia-ring, #b97d12)">p = 2 hole passes, q = 3 tube wraps</text>
  <text x="505" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-ring, #b97d12)">gcd(2,3) = 1 &#x2192; one closed strand</text>
  <text x="505" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="var(--dia-ring, #b97d12)">the trace closes after one traversal</text>
</svg>
