13.6,122 311.9,122.6 C 310.2,123.1 308.5,123.8 306.8,124.8 C 305.1,125.7 303.3,126.9 301.7,128.3 C 300.1,129.7 298.5,131.4 297.1,133.3 C 295.7,135.3 294.4,137.5 293.5,140 C 292.6,142.5 291.8,145.3 291.6,148.2 C 291.3,151 291.4,154.2 291.9,157.4 C 292.5,160.5 293.6,163.8 295.1,166.9 C 296.7,169.9 298.8,173.1 301.4,175.8 C 303.9,178.5 307,181 310.5,183 C 313.9,184.9 317.9,186.6 322,187.5 C 326.1,188.4 330.6,188.8 335,188.5 C 339.4,188.2 344,187.2 348.3,185.5 C 352.5,183.8 356.8,181.4 360.5,178.5 C 364.2,175.6 367.7,171.9 370.4,167.9 C 373.1,164 375.3,159.3 376.8,154.7 C 378.2,150 379,144.9 379,140 Z"
