        font-size="11" fill="var(--dia-ink, #24211a)" font-weight="bold">A</text>
  <text x="186" y="144" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-ink, #24211a)" font-weight="bold">B</text>
  <text x="130" y="227" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-neg, #cf3a26)" font-weight="bold">C</text>
  <text x="74" y="144" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="var(--dia-ink, #24211a)" font-weight="bold">D</text>

  <!-- Left figure label -->
  <text x="130" y="247" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="var(--dia-ink, #24211a)" font-weight="bold">figure-eight knot 4&#x2081;</text>
  <text x="130" y="261" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="9.5" fill="var(--dia-rigid, #8a8275)">(alternating, 4 crossings)</text>

  <!-- ============================ -->
  <!-- Arrow 1: flip crossing C     -->
  <!-- ============================ -->
