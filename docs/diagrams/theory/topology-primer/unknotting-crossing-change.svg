,118.4 C 105.9,119.7 103.4,121.3 101.1,123.3 C 98.9,125.4 96.5,127.7 94.6,130.5 C 92.7,133.3 90.8,136.5 89.5,140 C 88.2,143.5 87.1,147.5 86.8,151.6 C 86.4,155.7 86.5,160.2 87.3,164.7 C 88.1,169.1 89.6,173.8 91.8,178.2 C 94,182.5 97,187 100.7,190.8 C 104.3,194.6 108.7,198.3 113.6,201.1 C 118.5,203.9 124.2,206.2 130,207.5 C 135.8,208.8 142.2,209.4 148.5,208.9 C 154.7,208.5 161.3,207 167.3,204.7 C 173.4,202.3 179.5,198.9 184.7,194.7 C 190,190.6 194.9,185.3 198.7,179.7 C 202.6,174 205.8,167.5 207.8,160.9 C 209.9,154.2 211,147 211,140 Z"
