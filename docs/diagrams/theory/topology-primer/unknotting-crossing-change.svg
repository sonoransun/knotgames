<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300">
  <title>Unknotting the Figure-Eight Knot</title>
  <desc>The alternating figure-eight knot with its four crossings labeled A to D; flipping crossing C (highlighted in red) gives a diagram that Reidemeister moves simplify to a plain unknotted circle, showing the unknotting number of the figure-eight knot is 1.</desc>

  <!--
    Geometry: standard figure-eight (4_1) projection from the parametrization
      x = (2 + cos 2t) cos 3t,  y = (2 + cos 2t) sin 3t,  z = sin 4t
    which has exactly 4 self-crossings, perfectly alternating (z decides
    over/under). Crossings sit at compass points of each knot's center:
      A = North, B = East, C = South, D = West.
    Left knot: scale 27, center (130,140). Inset: scale 19, center (322,140).
    Every crossing uses the occlusion idiom (see crossingGap in lib/svg.js):
    continuous under-strand base path, then a surface-colored round-linecap
    stroke along the over strand's tangent, then the over-segment on top.
    Flipping ANY one crossing of this diagram yields the unknot (u(4_1) = 1);
    the inset flips C, matching puzzle 16 (The Crossing Number).
  -->

  <!-- ================================================== -->
  <!-- LEFT: figure-eight knot, alternating, crossings A-D -->
  <!-- ================================================== -->

